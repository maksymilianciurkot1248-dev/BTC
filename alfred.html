<!doctype html>
<html lang="pl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Alfred</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="calm.css">
<script src="ui.js"></script>
<script src="intent.js"></script>
<script src="assistant.js"></script>
<script src="calm.js"></script>
</head>
<body class="calm">
<main class="c-wrap">
  <div id="banner"></div>
  <section id="stage"></section>
  <div class="c-grid">
    <section class="pane" id="plan" aria-label="Plan dnia"></section>
    <div class="c-col">
      <section class="pane" id="habits" aria-label="Nawyki"></section>
      <a class="m-line" id="money" href="zarabiaj.html" aria-label="Pieniądze: otwórz Zarabiaj"></a>
      <section class="pane" id="alerts" aria-label="Uwagi" hidden></section>
      <button class="c-more-btn" id="moreBtn" type="button">Więcej: cele, przegląd dnia, tydzień, głos</button>
    </div>
  </div>
</main>
<div class="f-bar" id="focus" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const el = (t, a, ...k) => { const e = document.createElement(t); for (const [n, v] of Object.entries(a || {})) { if (typeof v === 'function' && n.startsWith('on')) e.addEventListener(n.slice(2), v); else if (v != null && v !== false) e.setAttribute(n, v === true ? '' : v); } for (const c of k.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); return e; };
const nf = (v, d = 0) => (v == null || Number.isNaN(v)) ? 'n/d' : new Intl.NumberFormat('pl-PL', {minimumFractionDigits: d, maximumFractionDigits: d}).format(v);
const zl = v => v == null ? 'n/d' : (v < 0 ? '−' : '') + nf(Math.abs(v), Math.abs(v - Math.round(v)) < 0.005 ? 0 : 2) + ' zł';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const hm = ts => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dur = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + m % 60 + ' min' : ''}` : `${m} min`;

const api = async path => { try { const r = await fetch('api/' + path, {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const MAX_TOP = 3;
let uid = 0; const newId = () => Date.now() * 10 + (uid++ % 10);

// ----------------------------------------------------------------- stan i zapis (scalanie zmian z dwóch urządzeń jak wcześniej)
const S = {tasks: [], habits: [], goals: [], journal: [], today: null, brief: null, ai: null, prompts: {}, offline: false, focus: null, habitEdit: false, review: null};
const KEYS = {alfred_tasks: ['tasks', v => v || [], v => v], alfred_habits: ['habits', v => (v && v.habits) || [], v => ({habits: v})], alfred_goals: ['goals', v => v || [], v => v], alfred_journal: ['journal', v => v || [], v => v]};
const MERGE = {
  alfred_tasks: (b, l, r) => UD.merge(b, l, r, 't'), alfred_goals: (b, l, r) => UD.merge(b, l, r, 't'), alfred_journal: (b, l, r) => UD.merge(b, l, r, 'date'),
  alfred_habits: (b, l, r) => ({habits: UD.merge(b && b.habits, l.habits, r.habits, 'id', (x, y) => ({...x, days: [...new Set([...x.days, ...y.days])].sort()}))}),
};
let rt = null; const refreshSoon = () => { clearTimeout(rt); rt = setTimeout(loadToday, 250); };
let retryT = null; const retrySoon = () => { clearTimeout(retryT); retryT = setTimeout(loadToday, 20000); };
async function persist(key) {
  const [field, parse, wrap] = KEYS[key];
  const r = await UD.sync(key, {get: () => wrap(S[field]), merge: MERGE[key], apply: v => { S[field] = parse(v); renderAll(); }});
  if (r.offline) { S.offline = true; renderBanner(); retrySoon(); }
  else if (!r.ok && r.conflict) Calm.toast('Dane zmieniono na innym urządzeniu: wczytano najnowszą wersję.');
  else if (!r.ok) Calm.toast('Błąd zapisu: ' + (r.error || ''));
  else if (r.merged) Calm.toast('Scalono zmiany z innego urządzenia.');
  refreshSoon();
}
const syncAll = () => Object.keys(KEYS).forEach(persist);
const openTasks = () => S.tasks.filter(t => !t.done);
const taskById = id => S.tasks.find(t => t.t === id);
const today = () => ymd(new Date());
const doneToday = () => S.tasks.filter(t => t.done && t.done_ts && ymd(new Date(t.done_ts)) === today());
const habitStreak = days => { const ds = new Set(days); let d = new Date(); if (!ds.has(ymd(d))) d = addDays(d, -1); let n = 0; while (ds.has(ymd(d))) { n++; d = addDays(d, -1); } return n; };

// ----------------------------------------------------------------- asystent (scena)
const HELP = 'Dotknij mojej postaci i mów albo pisz. Na przykład:\n• „dodaj zadanie raport 45 minut jutro”\n• „co dalej”, „start”, „zrobione”, „później”\n• „plan na jutro”, „ile zarobiłem”\n• „zrobiłem trening” (odhaczę nawyk)\nWszystko inne zrozumiem jako zwykłe pytanie.';
let alf, autoBubble = true, lastKey = '', lastTouch = Date.now();
const touch = () => { lastTouch = Date.now(); };
function chips() {
  const h = new Date().getHours(), c = [];
  if (h >= 19) c.push({label: 'Przegląd dnia', run: () => startReview()}); else if (h < 12 && S.brief && S.brief.text) c.push({label: 'Briefing', text: 'przeczytaj briefing'});
  c.push({label: 'Plan na jutro', text: 'plan na jutro'}, {label: 'Co potrafisz?', text: 'pomoc'});
  return c.slice(0, 3);
}
function nextBubble() {
  const T = S.today, hr = new Date().getHours(), g = hr < 5 ? 'Dobrej nocy.' : hr < 18 ? 'Dzień dobry.' : 'Dobry wieczór.';
  if (!T) return {key: 'load' + S.offline, text: S.offline ? `${g} Nie mam połączenia z serwerem, więc nie znam planu dnia. Zadania, które dodasz, zapiszą się same, gdy serwer wróci.` : `${g} Chwileczkę, układam Twój dzień…`, actions: []};
  const n = T.next_step, acts = [], t = n.t != null ? taskById(n.t) : null; let text;
  if (n.kind === 'task' && t) { const m = Math.min(25, n.min || 25); text = `${g} Zaczynamy od: ${n.title} (${n.min} min). ${sentence(n.why)}`; acts.push({label: `Start ${m} min`, primary: true, onclick: () => focusStart(t, m)}, {label: 'Zrobione', onclick: () => completeTask(t.t)}, {label: 'Później', onclick: () => postpone(t)}); }
  else if (n.kind === 'now_event' || n.kind === 'soon') text = `${sentence(n.title)} ${sentence(n.why)}`;
  else if (n.kind === 'plan') { text = `${g} Nie masz jeszcze planu na dziś. Dodaj zadanie niżej albo powiedz mi, co jest dziś najważniejsze.`; acts.push({label: 'Dodaj zadanie', primary: true, onclick: () => { const i = $('tnew'); if (i) { i.scrollIntoView({behavior: 'smooth', block: 'center'}); i.focus(); } }}); }
  else if (n.kind === 'overload') { text = `${sentence(n.title)} ${sentence(n.why)}`; acts.push({label: 'Przenieś je na jutro', primary: true, onclick: moveOverflow}); }
  else if (n.kind === 'review') { text = `${g} Zróbmy krótki przegląd dnia? Trzy pytania, dwie minuty.`; acts.push({label: 'Zaczynamy', primary: true, onclick: () => startReview()}); }
  else { text = `${sentence(n.title)} ${sentence(n.why)}`; acts.push({label: 'Zobacz jutro', onclick: () => alf.submit('plan na jutro')}); }
  if (hr < 12 && S.brief && S.brief.text) acts.push({label: 'Posłuchaj briefingu', onclick: speakBrief});
  return {key: [n.kind, n.title, n.t, S.brief && S.brief.ts, g].join('|'), text, actions: acts};
}
function showNext(force) {
  if (!alf || (!autoBubble && !force)) return;
  const b = nextBubble(); if (!force && b.key === lastKey) return; lastKey = b.key; autoBubble = true;
  alf.say(b.text, {actions: b.actions, keep: true, speak: false}); alf.setChips(chips());
  const bad = S.today && S.today.alerts.some(a => a.level === 'bad'); if (bad) alf.mood('worry');
}
function speakBrief() { autoBubble = false; touch(); alf.say(S.brief.text, {speak: true, keep: true}); }
async function askPrompt(label, prompt, so = {}) { autoBubble = false; touch(); await alf.submit(label, {...so, prompt}); }

// ----------------------------------------------------------------- polecenia głosowe i tekstowe
function planText(day) {
  const T = S.today; if (!T) return 'Nie znam jeszcze planu: brak połączenia z serwerem.';
  const P = T.plan[day], evs = P.timeline.filter(x => x.kind === 'event'), ts = P.blocks.length + P.unscheduled.length, label = day === 'today' ? 'dziś' : 'jutro';
  if (!evs.length && !ts) return `Na ${label} nic nie zaplanowano.`;
  const parts = []; if (evs.length) parts.push(`${evs.length} ${plural(evs.length, 'wydarzenie', 'wydarzenia', 'wydarzeń')}`); if (ts) parts.push(`${ts} ${plural(ts, 'zadanie', 'zadania', 'zadań')}`);
  let text = `Na ${label} masz ${parts.join(' i ')}.`; const first = P.timeline.find(x => day !== 'today' || x.e > Date.now() / 1000);
  if (first) text += ` Najbliżej: ${first.title} o ${hm(first.s)}.`; if (P.summary.overloaded) text += ' Nie wszystko się zmieści.';
  return text;
}
function whenLabel(date) { const td = today(); return date === td ? 'na dziś' : date === ymd(addDays(new Date(), 1)) ? 'na jutro' : 'na ' + date.slice(8) + '.' + date.slice(5, 7); }
function addTask(p) {
  const top = p.top && openTasks().filter(x => x.top).length < MAX_TOP, t = {t: newId(), text: p.text, date: p.date || today(), done: false, top: !!top, done_ts: null, min: p.min || 30, ref: ''};
  S.tasks.push(t); persist('alfred_tasks'); renderPlan(); renderHabits(); return {t, topDenied: p.top && !top};
}
function findDoneTarget(query) {
  if (!query) { const n = S.today && S.today.next_step; const t = n && n.t != null ? taskById(n.t) : null; if (t) return {task: t}; const o = openTasks().filter(x => x.date && x.date <= today()); return o.length === 1 ? {task: o[0]} : {many: o}; }
  const tm = Intent.match(query, openTasks(), t => t.text), hm_ = Intent.match(query, S.habits, h => h.name);
  if (tm.length === 1 && !hm_.length) return {task: tm[0]}; if (hm_.length === 1 && !tm.length) return {habit: hm_[0]};
  if (tm.length > 1) return {many: tm}; if (tm.length === 1) return {task: tm[0]};
  return {none: true};
}
async function onCommand(cmd) {
  autoBubble = false; touch();
  switch (cmd.type) {
    case 'add_task': { const {t, topDenied} = addTask(cmd); return {text: `Dodane ${whenLabel(t.date)}: ${t.text}, ${t.min} min.` + (topDenied ? ` Priorytetów może być najwyżej ${MAX_TOP}, więc bez gwiazdki.` : ''), mood: 'happy'}; }
    case 'next': { const b = nextBubble(); return {text: b.text, actions: b.actions}; }
    case 'plan': return {text: planText(cmd.day), actions: [{label: 'Zaproponuj plan (AI)', onclick: () => askPrompt(cmd.day === 'today' ? 'Zaproponuj plan na dziś' : 'Zaproponuj plan na jutro', S.prompts.tomorrow || 'Zaproponuj plan dnia.')}]};
    case 'done': {
      const r = findDoneTarget(cmd.query);
      if (r.task) { completeTask(r.task.t, null, null, true); return {text: `Zrobione: ${r.task.text}.`, mood: 'happy'}; }
      if (r.habit) { const h = r.habit; if (!h.days.includes(today())) { h.days = [...h.days, today()].sort(); persist('alfred_habits'); renderHabits(); } return {text: `Odhaczone: ${h.name}. Seria: ${habitStreak(h.days)}.`, mood: 'happy'}; }
      if (r.many) return {text: r.many.length ? 'Które zadanie? ' + r.many.slice(0, 5).map(t => t.text).join('; ') + '.' : 'Nie mam dziś otwartych zadań.'};
      return {text: `Nie znalazłem zadania ani nawyku pasującego do „${cmd.query}”.`};
    }
    case 'start': { const n = S.today && S.today.next_step, t = (n && n.t != null ? taskById(n.t) : null) || openTasks()[0]; if (!t) return {text: 'Nie mam zadania do skupienia. Najpierw jakieś dodaj.'}; const m = cmd.min || Math.min(25, t.min || 25); focusStart(t, m); return {text: `Start. Skupienie na: ${t.text}, ${m} minut.`}; }
    case 'stopfocus': if (S.focus) { focusStop(); return {text: 'Skupienie zakończone.'}; } return {text: 'Skupienie nie jest włączone.'};
    case 'later': { const n = S.today && S.today.next_step, t = n && n.t != null ? taskById(n.t) : null; if (!t) return {text: 'Nie mam czego przekładać.'}; postpone(t, true); return {text: `Przeniosłem na jutro: ${t.text}.`}; }
    case 'money': { const T = S.today; if (!T) return {text: 'Nie znam jeszcze wyników: brak połączenia z serwerem.'}; const m = T.money, st = T.deals.stats, c = st.counts, prog = c.kupione + c.wystawione; return {text: `W tym miesiącu zysk ${zl(m.profit_month == null ? 0 : m.profit_month)}` + (m.goal ? `, cel ${zl(m.goal)}` : '') + `. Ofert w toku: ${prog}` + (st.invested ? `, zamrożone ${zl(st.invested)}` : '') + '.', actions: [{label: 'Otwórz Zarabiaj', onclick: () => { location.href = 'zarabiaj.html'; }}]}; }
    case 'briefing': if (S.brief && S.brief.text) return {text: S.brief.text, speak: true}; await askPrompt('Poranny briefing', S.prompts.morning || 'Poranny briefing na dziś.'); return null;
    case 'review': startReview(); return null;
    case 'add_habit': { if (S.habits.length >= 30) return {text: 'Masz już 30 nawyków, to maksimum.'}; S.habits.push({id: String(newId()), name: cmd.name, days: []}); persist('alfred_habits'); renderHabits(); return {text: `Nowy nawyk: ${cmd.name}.`, mood: 'happy'}; }
    case 'deal_bought': case 'deal_listed': case 'deal_sold': case 'deal_reject': case 'add_deal': return {text: 'Ofertami zajmujemy się na stronie Zarabiaj.', actions: [{label: 'Otwórz Zarabiaj', primary: true, onclick: () => { location.href = 'zarabiaj.html'; }}]};
    default: return undefined;
  }
}
const REVIEW_Q = ['Co dziś poszło dobrze?', 'Czego się dziś nauczyłeś?', 'Co jutro zrobisz jako pierwsze?'];
function startReview() {
  autoBubble = false; touch(); S.review = {i: 0, ans: []}; sheetClose();
  alf.say(REVIEW_Q[0], {keep: true, listenAfter: true, actions: [{label: 'Anuluj', onclick: cancelReview}]}); alf.setChips([{label: 'Pomiń pytanie', run: () => reviewAnswer('')}]);
}
function cancelReview() { S.review = null; alf.say('Dobrze, przegląd zostawiamy na później.', {keep: true}); alf.setChips(chips()); }
function reviewAnswer(text) {
  const r = S.review; if (!r) return; r.ans.push(String(text || '').trim()); r.i++;
  if (r.i < REVIEW_Q.length) { alf.say(REVIEW_Q[r.i], {keep: true, listenAfter: true, actions: [{label: 'Anuluj', onclick: cancelReview}]}); return; }
  S.review = null; const td = today(), e = {date: td, wins: (r.ans[0] || '').slice(0, 500), lesson: (r.ans[1] || '').slice(0, 500), tomorrow: (r.ans[2] || '').slice(0, 500)};
  if (!e.wins && !e.lesson && !e.tomorrow) { alf.say('Nic nie zapisałem. Wrócimy do tego, kiedy zechcesz.', {keep: true}); alf.setChips(chips()); return; }
  S.journal = [...S.journal.filter(x => x.date !== td), e].sort((a, b) => a.date.localeCompare(b.date)).slice(-120); persist('alfred_journal');
  alf.say('Zapisane. Dobra robota. ' + (e.tomorrow ? `Jutro zaczynasz od: ${e.tomorrow}.` : ''), {keep: true, mood: 'happy'}); alf.setChips(chips());
}
async function intercept(raw, cmd) {
  autoBubble = false; touch();
  if (!S.review) return undefined;
  if (/^(anuluj|koniec|przerwij|stop|nie chce)\b/i.test(Intent.fold(raw))) { cancelReview(); return null; }
  reviewAnswer(raw); return null;
}

// ----------------------------------------------------------------- plan dnia
function renderBanner() { $('banner').replaceChildren(...(S.offline ? [el('div', {class: 'c-banner'}, 'Serwer niedostępny: widzisz kopię z tej przeglądarki. Zadania i nawyki zapiszą się same, gdy serwer wróci.')] : [])); }
const timeEl = it => el('span', {class: 't-time'}, hm(it.s), el('span', {class: 't-end'}, '–' + hm(it.e)));
function evRow(it, now) {
  const cur = it.s <= now && now < it.e, past = it.e < now;
  return el('div', {class: 't-row ev' + (cur ? ' now' : '') + (past ? ' past' : '')}, timeEl(it), el('div', {class: 't-body', style: 'cursor:default'}, el('span', {class: 't-title'}, it.title), it.loc ? el('span', {class: 't-sub'}, it.loc) : null));
}
function taskRow(t, it, opts = {}) {
  const row = el('div', {class: 't-row' + (opts.done ? ' done' : '') + (it && it.s <= Date.now() / 1000 && Date.now() / 1000 < it.e ? ' now' : ''), 'data-t': String(t.t)});
  const chk = el('button', {class: 't-check', type: 'button', 'aria-label': (opts.done ? 'Cofnij: ' : 'Zrobione: ') + t.text}); chk.innerHTML = CHECK;
  chk.addEventListener('click', ev => opts.done ? undone(t) : completeTask(t.t, row, ev));
  const sub = [it ? `${dur(it.min)}` : (t.min ? dur(t.min) : ''), t.date && t.date < today() && !opts.done ? 'zaległe' : ''].filter(Boolean).join(' · ');
  const body = el('button', {class: 't-body', type: 'button', onclick: () => openTask(t.t)}, el('span', {class: 't-title'}, (t.top ? '★ ' : '') + t.text), sub || opts.note ? el('span', {class: 't-sub'}, opts.note || sub) : null);
  row.append(chk, it ? timeEl(it) : null, body);
  if (t.ref) row.append(el('span', {class: 't-pill'}, 'oferta'));
  if (!opts.done && it) row.append(el('button', {class: 't-go', type: 'button', onclick: () => focusStart(t, Math.min(25, it.min))}, 'Start'));
  return row;
}
function renderPlan() {
  const box = $('plan'), T = S.today, now = Date.now() / 1000, td = today(), kids = [];
  const dn = doneToday(), P = T && T.plan.today;
  const blocks = P ? P.blocks.filter(b => { const t = taskById(b.t); return t && !t.done; }) : [], un = P ? P.unscheduled.filter(u => { const t = taskById(u.t); return t && !t.done; }) : [];
  const planned = new Set([...blocks.map(b => b.t), ...un.map(u => u.t)]);
  const extra = openTasks().filter(t => (t.top || (t.date && t.date <= td)) && !planned.has(t.t));
  const open = blocks.length + un.length + extra.length, total = open + dn.length;
  const d = new Date();
  kids.push(el('div', {class: 'pane-h'}, el('div', null, el('div', {class: 'pane-t'}, 'Dziś'), el('div', {class: 'pane-s'}, d.toLocaleDateString('pl-PL', {weekday: 'long', day: 'numeric', month: 'long'}))), total ? el('div', {class: 'pane-s'}, `${dn.length} z ${total} zrobione`) : null));
  if (total) kids.push(el('div', {class: 'c-prog', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(dn.length), 'aria-label': 'Postęp dnia'}, el('i', {style: `width:${Math.round(dn.length / total * 100)}%`})));
  const list = el('div', {class: 't-list'});
  if (P) P.timeline.forEach(it => { if (it.kind === 'event') list.append(evRow(it, now)); else { const t = taskById(it.t); if (t && !t.done) list.append(taskRow(t, it)); } });
  un.forEach(u => { const t = taskById(u.t); if (t) list.append(taskRow(t, null, {note: `${dur(u.min)} · nie mieści się dziś`})); });
  extra.forEach(t => list.append(taskRow(t, null, {note: 'układam w planie…'})));
  if (!T && !S.offline && !openTasks().length) list.append(el('div', {class: 't-empty'}, 'Ładuję plan…'));
  else if (!list.children.length) list.append(el('div', {class: 't-empty'}, el('b', null, dn.length ? 'Wszystko zrobione na dziś' : 'Czysty dzień'), dn.length ? 'Dobra robota. Odpocznij albo zerknij na jutro.' : 'Dodaj pierwsze zadanie poniżej albo powiedz mi, co dziś ważne.'));
  kids.push(list);
  if (P && P.free.length && open) kids.push(el('div', {class: 't-free'}, 'Wolne okna: ' + P.free.slice(0, 4).map(([a, b]) => `${hm(a)}–${hm(b)}`).join(', ')));
  if (un.length) kids.push(el('button', {class: 'c-link', type: 'button', onclick: moveOverflow}, `Przenieś ${un.length === 1 ? 'to zadanie' : 'te zadania'} na jutro`));
  const inp = el('input', {id: 'tnew', type: 'text', placeholder: 'Dodaj zadanie, np. Raport 45 min jutro', 'aria-label': 'Nowe zadanie', maxlength: '200', autocomplete: 'off', enterkeyhint: 'done'});
  const add = () => { const p = Intent.parseTask(inp.value, {today: td}); if (!p.text) return; addTask(p); inp.value = ''; draft = ''; Calm.toast(`Dodane ${whenLabel(S.tasks[S.tasks.length - 1].date)}: ${p.text}`); };

  const ago = s => s == null ? 'n/d' : s < 5400 ? Math.round(s / 60) + ' min temu' : s < 172800 ? Math.round(s / 3600) + ' h temu' : Math.round(s / 86400) + ' dni temu';
  const tile = (v, l, s) => el('div', null, el('b', null, v), el('span', null, l), s ? el('span', {style: 'display:block'}, s) : null);
  const tiles = [st ? tile(st.equity != null ? nf(st.equity) + ' USDT' : 'n/d', `bot (${st.mode || '?'})`, st.pnl_today != null ? `dziś ${st.pnl_today >= 0 ? '+' : '−'}${nf(Math.abs(st.pnl_today), 2)} USDT` : '') : tile('n/d', 'bot', 'brak danych'),
    bk && bk.ts ? tile(bk.age_s == null ? 'brak' : ago(bk.age_s), 'kopia zapasowa', bk.ok === false ? 'ostatnia próba nieudana' : '') : tile('nie ma', 'kopia zapasowa', 'Dysk Google nie podłączony'),
    ag && ag.configured ? tile(ag.age_s == null ? 'brak' : ago(ag.age_s), 'kalendarz', ag.ok ? `${(ag.events || []).length} wydarzeń` : 'są błędy') : tile('nie ma', 'kalendarz', 'nie podłączony'),
    S.ai ? tile(S.ai.ready ? 'działa' : 'wyłączony', 'Alfred (AI)', S.ai.search_limit != null ? `przeglądy internetu dziś: ${S.ai.search_left}/${S.ai.search_limit}` : '') : tile('n/d', 'Alfred (AI)', '')];
  const info = ((S.today && S.today.alerts) || []).filter(a => a.level === 'info');
  box.replaceChildren(el('div', {class: 's-tiles'}, ...tiles), ...(info.length ? [el('p', {class: 'c-note'}, 'Podpowiedzi:')].concat(info.map(a => el('p', {class: 'c-note', style: 'margin:3px 0'}, '• ' + a.text))) : []), el('p', {class: 'c-note'}, 'Szczegóły bota: zakładka Bot. Kopia zapasowa i kalendarz: instrukcja serwera.'));
}
$('moreBtn').addEventListener('click', openMore);

// ----------------------------------------------------------------- start
function renderAll() { renderBanner(); renderPlan(); renderHabits(); renderMoney(); renderAlerts(); showNext(); }
async function loadToday() {
  const t = await api('today');
  if (t) { S.today = t; if (S.offline) { S.offline = false; syncAll(); } } else { S.offline = true; retrySoon(); }
  if (!autoBubble && Date.now() - lastTouch > 90000 && !alf.busy && !S.review && !S.focus) autoBubble = true;
  renderAll();
}
async function loadMeta() { const al = await api('alfred'); if (al) { S.ai = al.ai; S.prompts = al.prompts || {}; const sb = al.briefing; if (sb && sb.text && !(S.brief && S.brief.ts >= (sb.ts || 0))) S.brief = sb; showNext(); alf.setChips(autoBubble ? chips() : []); } }
(async () => {
  alf = Alfred.mount($('stage'), {role: 'alfred', page: 'dzis', onCommand, intercept, helpText: HELP, ask: (msgs, so) => AI.run('alfred', msgs, !!so.search)});
  renderAll(); showNext(true);
  const loaded = await Promise.all(Object.keys(KEYS).map(k => UD.load(k)));
  Object.keys(KEYS).forEach((k, i) => { S[KEYS[k][0]] = KEYS[k][1](loaded[i].value); if (loaded[i].offline) S.offline = true; });
  renderAll(); await Promise.all([loadToday(), loadMeta()]); showNext(true);
  setInterval(loadToday, 120000); setInterval(() => { if (!S.focus) renderPlan(); }, 60000);
  window.__alfred = alf;
})();
})();
