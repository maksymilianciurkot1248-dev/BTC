<!doctype html>
<html lang="pl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dziś</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui.css">
<script src="ui.js"></script>
<style>
:root{--bg:#EDF0F4;--card:#fff;--card2:#F5F7FA;--line:#DCE2E9;--ink:#111D29;--muted:#5B6978;--accent:#E8830C;--bull:#12805A;--bear:#C1334A;--warn:#B7791F;--sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0F16;--card:#111A25;--card2:#16212E;--line:#223142;--ink:#E8EEF4;--muted:#93A1B1;--accent:#F7A234;--bull:#3DDC97;--bear:#FF6B81;--warn:#E6B450}}
:root[data-theme="dark"]{--bg:#0A0F16;--card:#111A25;--card2:#16212E;--line:#223142;--ink:#E8EEF4;--muted:#93A1B1;--accent:#F7A234;--bull:#3DDC97;--bear:#FF6B81;--warn:#E6B450}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 90px}
h1,h2,h3{margin:0} h2{font-size:1.05rem;margin-bottom:4px} h3{font-size:.84rem;color:var(--muted);margin:12px 0 4px;font-weight:600}
a{color:var(--accent)} .sub{color:var(--muted);font-size:.85rem;margin:0 0 10px} .note{color:var(--muted);font-size:.8rem;margin:8px 0 0} .mut{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:18px 22px 14px;margin-bottom:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,var(--card)),var(--card) 60%)}
.hero:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello{font-size:1.6rem;font-weight:700;line-height:1.2} .date{color:var(--muted);font-size:.95rem} .date::first-letter{text-transform:uppercase}
.clock{font-variant-numeric:tabular-nums;font-size:2.6rem;font-weight:300;letter-spacing:.02em;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.78rem;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chip.ok{border-color:var(--bull);color:var(--bull)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:8px 14px;font-size:.86rem;margin-bottom:8px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.alert.bad{border-color:var(--bear);background:color-mix(in srgb,var(--bear) 12%,transparent)} .alert b{flex:none}
.next{margin-bottom:14px;border-left:4px solid var(--accent)} .next .lab{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.next .big{font-size:1.45rem;font-weight:700;line-height:1.25;margin:2px 0} .next .why{color:var(--muted);font-size:.92rem}
.ask{margin-bottom:14px}
#chatHist{margin-top:8px}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-bottom:14px} .col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:860px){.cols{grid-template-columns:1fr}.col{display:contents}#plan{order:1}#tasks{order:2}#habits{order:3}#money{order:4}}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);font:inherit;font-size:.9rem}
textarea{min-height:56px;resize:vertical} label{display:block;font-size:.76rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .row>.grow{flex:1;min-width:130px}
.btn{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.84rem;cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff} .btn.sm{padding:3px 10px;font-size:.76rem} .btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;margin:8px 0 6px} .tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;border-radius:999px;font:inherit;font-size:.78rem;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.item{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.9rem} .item:last-child{border-bottom:0}
.item input[type=checkbox]{width:18px;height:18px;flex:none;margin:0} .item .t{flex:1 1 140px;min-width:0;overflow-wrap:anywhere} .item.done .t{text-decoration:line-through;color:var(--muted)}
.star{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px} .star.on{color:var(--accent)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px} .x:hover{color:var(--bear)}
.badge{font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap} .badge.late{border-color:var(--bear);color:var(--bear)}
.tl{display:flex;gap:10px;padding:6px 8px;font-size:.88rem;border-left:3px solid var(--line);margin:3px 0;align-items:center;flex-wrap:wrap}
.tl .h{flex:none;width:96px;font-variant-numeric:tabular-nums;color:var(--muted)} .tl .t{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.tl.event{border-left-color:#4C8BF5;background:color-mix(in srgb,#4C8BF5 7%,transparent)} .tl.task{border-left-color:var(--accent)} .tl.past{opacity:.5} .tl.now{border-left-width:5px;font-weight:600}
.free{font-size:.8rem;color:var(--bull);margin:6px 0 0} .sumline{font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.dots{display:flex;gap:5px} .dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--muted);font:inherit;font-size:.68rem;cursor:pointer;padding:0}
.dot.on{background:var(--bull);border-color:var(--bull);color:#fff} .dot.today{outline:2px solid var(--accent);outline-offset:1px}
.bar{height:10px;background:var(--card2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 2px} .bar i{display:block;height:100%;background:var(--bull)}
.kv{display:flex;gap:10px;flex-wrap:wrap} .kv div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:110px} .kv b{display:block;font-size:1.05rem} .kv span{font-size:.72rem;color:var(--muted)}
#chat{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:340px;overflow-y:auto}
.m{padding:9px 13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;max-width:94%} .m.u{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,transparent)} .m.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.brief{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0 0}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px} details.card>summary::-webkit-details-marker{display:none} details.card>summary:after{content:"▾";color:var(--muted);flex:none} details.card[open]>summary:after{content:"▴"}
details.more{margin-bottom:14px} .wk{display:flex;gap:8px;align-items:flex-end;height:96px;margin:8px 0} .wk div{flex:1;text-align:center;font-size:.7rem;color:var(--muted)} .wk i{display:block;background:var(--bull);border-radius:6px 6px 0 0;margin:0 auto;width:70%;min-height:2px}
.prop{border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;margin-top:8px} .prop label{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--ink);padding:3px 0}
#focus{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;padding:10px 16px;background:var(--card);border-top:2px solid var(--accent);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
#focus.on{display:block} #focus .in{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap} #focus .tm{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:600} #focus.end{background:color-mix(in srgb,var(--accent) 18%,var(--card))}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid var(--warn);border-radius:12px;padding:9px 13px;font-size:.84rem;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:.84rem;z-index:50;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
<div class="hero" id="hero">
  <div class="hud"><div><div class="hello" id="hello">Dzień dobry</div><div class="date" id="date"></div></div><div class="clock" id="clock"></div></div>
  <div class="chips" id="chips"></div>
</div>
<div id="banner"></div>
<div id="alerts"></div>
<section class="card next" id="next"></section>
<div class="cols">
  <div class="col"><section class="card" id="plan"></section><section class="card" id="habits"></section></div>
  <div class="col"><section class="card" id="tasks"></section><section class="card" id="money"></section></div>
</div>
<section class="card ask" id="ask"></section>
<details class="card more" id="more"><summary>Cele, przegląd dnia i tydzień w liczbach</summary><div id="moreBody"></div></details>
<details class="card more" id="systems"><summary>Systemy i podpowiedzi</summary><div id="sysBody"></div></details>
</div>
<div id="focus" role="status"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const el = (t, a, ...k) => { const e = document.createElement(t); for (const [n, v] of Object.entries(a || {})) { if (typeof v === 'function' && n.startsWith('on')) e.addEventListener(n.slice(2), v); else if (v != null && v !== false) e.setAttribute(n, v === true ? '' : v); } for (const c of k) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); return e; };
const nf = (v, d = 0) => (v == null || Number.isNaN(v)) ? 'n/d' : new Intl.NumberFormat('pl-PL', {minimumFractionDigits: d, maximumFractionDigits: d}).format(v);
const num = v => nf(v, Number.isInteger(v) ? 0 : 1);
const zl = v => (v < 0 ? '−' : '') + nf(Math.abs(v), Number.isInteger(v) ? 0 : 2) + ' zł';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hm = ts => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dur = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + m % 60 + ' min' : ''}` : `${m} min`;
const api = async path => { try { const r = await fetch('api/' + path, {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
const lg = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const ls = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* tryb prywatny */ } };
let toastT = null;
const toast = msg => { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = el('div', {class: 'toast', role: 'status'}, msg); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4500); };
const MAX_TOP = 3;
// Przerysowanie karty nie może kasować tego, co użytkownik właśnie wpisuje: wartości pól data-k, które ruszył (data-d), i fokus przechodzą na nowe elementy.
// Pola nietknięte biorą świeże dane (np. z serwera), więc stary pusty formularz nie nadpisuje wczytanych wartości.
document.addEventListener('input', ev => { const t = ev.target; if (t && t.dataset && t.dataset.k) t.dataset.d = '1'; });
const clean = (...els) => els.forEach(e => { delete e.dataset.d; });
function rerender(box, kids) {
  const old = {}, ae = document.activeElement, fk = ae && box.contains(ae) ? ae.dataset.k : null;
  box.querySelectorAll('[data-d="1"]').forEach(e => { old[e.dataset.k] = e.value; });
  box.replaceChildren(...kids);
  box.querySelectorAll('[data-k]').forEach(e => { if (e.dataset.k in old) { e.value = old[e.dataset.k]; e.dataset.d = '1'; } });
  if (fk) { const n = box.querySelector(`[data-k="${fk}"]`); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { /* pole liczby lub daty nie ma kursora */ } } }
}

// ----------------------------------------------------------------- stan
const S = {tasks: [], habits: [], goals: [], journal: [], today: null, brief: null, ai: null, prompts: {}, offline: false, tab: 'dzis', taskTab: 'dzis', chat: [], chatOpen: false, focus: null, proposal: null, sys: null};
const KEYS = {alfred_tasks: ['tasks', v => v || [], v => v], alfred_habits: ['habits', v => (v && v.habits) || [], v => ({habits: v})], alfred_goals: ['goals', v => v || [], v => v], alfred_journal: ['journal', v => v || [], v => v]};
let uid = 0; const newId = () => Date.now() * 10 + (uid++ % 10);
let rt = null; const refreshSoon = () => { clearTimeout(rt); rt = setTimeout(loadToday, 250); };
// Konflikt zapisu (inne urządzenie albo potok ofert na serwerze zmieniły dane) nie gubi niczyich zmian: scalamy po id wersję ostatnio zsynchronizowaną, naszą i serwerową.
const MERGE = {
  alfred_tasks: (b, l, r) => UD.merge(b, l, r, 't'), alfred_goals: (b, l, r) => UD.merge(b, l, r, 't'), alfred_journal: (b, l, r) => UD.merge(b, l, r, 'date'),
  alfred_habits: (b, l, r) => ({habits: UD.merge(b && b.habits, l.habits, r.habits, 'id', (x, y) => ({...x, days: [...new Set([...x.days, ...y.days])].sort()}))}),
};
async function persist(key) {
  const [field, parse, wrap] = KEYS[key];
  const r = await UD.sync(key, {get: () => wrap(S[field]), merge: MERGE[key], apply: v => { S[field] = parse(v); renderAll(); }});
  if (r.offline) { S.offline = true; renderBanner(); retrySoon(); }
  else if (!r.ok && r.conflict) toast('Dane zmieniono na innym urządzeniu: wczytano najnowszą wersję.');
  else if (!r.ok) toast('Błąd zapisu: ' + (r.error || ''));
  else if (r.merged) toast('Scalono zmiany z innego urządzenia.');
  refreshSoon();
}
let retryT = null;
function retrySoon() { clearTimeout(retryT); retryT = setTimeout(loadToday, 20000); }
const syncAll = () => Object.keys(KEYS).forEach(persist);
const openTasks = () => S.tasks.filter(t => !t.done);
const todayTasks = () => { const td = ymd(new Date()); return openTasks().filter(t => t.top || (t.date && t.date <= td)); };
const taskById = id => S.tasks.find(t => t.t === id);
function markDone(t) { t.done = true; t.done_ts = Date.now(); persist('alfred_tasks'); renderTasks(); renderHero(); }
function toTomorrow(t) { t.date = ymd(addDays(new Date(), 1)); t.top = false; }

// ----------------------------------------------------------------- hero, baner, uwagi
function renderHero() {
  const now = new Date(), h = now.getHours(), T = S.today;
  $('hello').textContent = h < 5 ? 'Dobrej nocy' : h < 18 ? 'Dzień dobry' : 'Dobry wieczór';
  $('date').textContent = now.toLocaleDateString('pl-PL', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  $('clock').textContent = `${pad(h)}:${pad(now.getMinutes())}`;
  const chips = $('chips'); chips.replaceChildren(); const nowS = Date.now() / 1000;
  const next = T && T.plan.today.timeline.find(e => e.kind === 'event' && e.s > nowS);
  if (next) { const m = Math.max(1, Math.round((next.s - nowS) / 60)); chips.append(el('span', {class: 'chip'}, `Następne: ${hm(next.s)} ${next.title.slice(0, 36)} (za ${m < 90 ? m + ' min' : Math.round(m / 60) + ' h'})`)); }
  const tt = todayTasks(); chips.append(el('span', {class: 'chip' + (tt.length ? '' : ' ok')}, tt.length ? `Zadania na dziś: ${tt.length}` : 'Lista na dziś pusta'));
  if (S.habits.length) { const td = ymd(now), done = S.habits.filter(x => x.days.includes(td)).length; chips.append(el('span', {class: 'chip' + (done === S.habits.length ? ' ok' : '')}, `Nawyki: ${done}/${S.habits.length}`)); }
  const m = T && T.money; if (m && m.goal && m.profit_month != null) chips.append(el('span', {class: 'chip' + (m.profit_month >= m.goal ? ' ok' : '')}, `Zarobki w miesiącu: ${nf(m.profit_month / m.goal * 100)}% celu`));
}
function renderBanner() { $('banner').replaceChildren(...(S.offline ? [el('div', {class: 'warnbox'}, 'Serwer niedostępny: pracujesz na kopii z tej przeglądarki, a plan dnia i alerty wymagają połączenia. Zmiany zapiszą się same, gdy serwer wróci (strona ponawia próbę co 20 s).')] : [])); }
function renderAlerts() {
  const box = $('alerts'); box.replaceChildren(); const list = ((S.today && S.today.alerts) || []).filter(a => a.level !== 'info').slice(0, 4);
  list.forEach(a => box.append(el('div', {class: 'alert' + (a.level === 'bad' ? ' bad' : '')}, el('b', null, a.level === 'bad' ? 'Pilne:' : 'Uwaga:'), el('span', null, a.text))));
}

// ----------------------------------------------------------------- następny krok i briefing
function renderNext() {
  const box = $('next'), T = S.today;
  if (!T) { box.replaceChildren(el('div', {class: 'lab'}, 'Następny krok'), el('div', {class: 'big'}, S.offline ? 'Plan dnia wymaga połączenia z serwerem' : 'Ładuję plan…')); return; }
  const n = T.next_step, kids = [el('div', {class: 'lab'}, 'Następny krok'), el('div', {class: 'big'}, n.title), el('div', {class: 'why'}, n.why)], row = el('div', {class: 'row', style: 'margin-top:10px'});
  const t = n.t != null ? taskById(n.t) : null;
  if (n.kind === 'task' && t) {
    row.append(el('button', {class: 'btn p', type: 'button', onclick: () => focusStart(t, Math.min(25, n.min || 25))}, `Start ${Math.min(25, n.min || 25)} min`), el('button', {class: 'btn', type: 'button', onclick: () => markDone(t)}, 'Zrobione'),
      el('button', {class: 'btn', type: 'button', onclick: () => { toTomorrow(t); persist('alfred_tasks'); renderTasks(); toast('Przeniesione na jutro.'); }}, 'Później'));
  } else if (n.kind === 'plan') row.append(el('button', {class: 'btn p', type: 'button', onclick: () => { const i = $('tnew'); i.scrollIntoView({behavior: 'smooth', block: 'center'}); i.focus(); }}, 'Dodaj zadanie'));
  else if (n.kind === 'overload') row.append(el('button', {class: 'btn p', type: 'button', onclick: moveOverflow}, 'Przenieś te zadania na jutro'));
  else if (n.kind === 'review') row.append(el('button', {class: 'btn p', type: 'button', onclick: () => { $('more').open = true; $('more').scrollIntoView({behavior: 'smooth', block: 'start'}); }}, 'Otwórz przegląd dnia'));
  else if (n.kind === 'rest') row.append(el('button', {class: 'btn', type: 'button', onclick: () => { S.tab = 'jutro'; renderPlan(); $('plan').scrollIntoView({behavior: 'smooth'}); }}, 'Zobacz jutro'));
  row.append(el('button', {class: 'btn', type: 'button', onclick: () => { const i = $('cin'); i.scrollIntoView({behavior: 'smooth', block: 'center'}); i.focus(); }}, 'Zapytaj Alfreda'));
  kids.push(row);
  const b = S.brief;
  if (b && b.text) { const d = el('details', {style: 'margin-top:10px'}, el('summary', {class: 'mut', style: 'cursor:pointer;font-size:.84rem'}, `Briefing z ${new Date(b.ts * 1000).toLocaleString('pl-PL', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'})}${b.kind === 'plain' ? ' (bez AI)' : ''}`), el('div', {class: 'brief'}, b.text)); if (S.briefOpen === undefined ? new Date().getHours() < 12 : S.briefOpen) d.open = true; d.addEventListener('toggle', () => { S.briefOpen = d.open; }); kids.push(d); }
  box.replaceChildren(...kids);
}
function moveOverflow() {
  const un = S.today.plan.today.unscheduled; let n = 0;
  un.forEach(u => { const t = taskById(u.t); if (t) { toTomorrow(t); n++; } });
  persist('alfred_tasks'); renderTasks(); toast(n ? `Przeniesiono na jutro: ${n}.` : 'Nic do przeniesienia.');
}

// ----------------------------------------------------------------- plan dnia
function renderPlan() {
  const box = $('plan'), T = S.today, kids = [el('h2', null, 'Plan dnia'), el('p', {class: 'sub'}, 'Kalendarz i zadania ułożone w wolnych oknach. To propozycja: niczego nie zmienia w Twoim kalendarzu.')];
  const tabs = el('div', {class: 'tabs', role: 'group'}); [['dzis', 'Dziś'], ['jutro', 'Jutro']].forEach(([k, l]) => tabs.append(el('button', {type: 'button', 'aria-pressed': S.tab === k ? 'true' : 'false', onclick: () => { S.tab = k; renderPlan(); }}, l))); kids.push(tabs);
  if (!T) { kids.push(el('p', {class: 'mut'}, S.offline ? 'Brak połączenia z serwerem.' : 'Ładuję…')); box.replaceChildren(...kids); return; }

  if (canSpeak) { const lab = el('label', {style: 'display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--ink);margin-left:auto'}), cb = el('input', {type: 'checkbox', style: 'width:16px;height:16px'}); cb.checked = speakOn; cb.addEventListener('change', () => { speakOn = cb.checked; ls('alfred_speak', speakOn ? '1' : '0'); if (!speakOn) { try { speechSynthesis.cancel(); } catch (e) { /* brak */ } } }); lab.append(cb, 'Czytaj odpowiedzi na głos'); quick.append(lab); }
  box.replaceChildren(el('h2', null, 'Zapytaj Alfreda'), row, quick, el('button', {class: 'btn sm', id: 'chatHist', type: 'button', onclick: () => { S.chatOpen = true; drawChat(); }}), el('div', {id: 'chat', 'aria-live': 'polite'}), el('div', {id: 'proposal'}), tools, el('p', {class: 'note', id: 'cst'}, ''));
  drawChat(); renderProposal();
}
async function ask(promptKey, label, search) {
  if (busy) { toast('Alfred jeszcze odpowiada.'); return; }
  const text = promptKey ? (S.prompts[promptKey] || '') : label; if (!text.trim()) { toast(promptKey ? 'Prompt niedostępny: odśwież stronę.' : ''); return; }
  busy = true; S.chatOpen = true; const cst = $('cst'); cst.textContent = search ? 'Alfred przeszukuje internet (do ok. 2 minut)…' : 'Alfred myśli…';
  S.chat.push({role: 'user', content: text, shown: promptKey ? `▸ ${label}` : text}); drawChat(); $('ask').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  try {
    const msgs = S.chat.slice(-20).map(m => ({role: m.role, content: m.content})); while (msgs.length && msgs[0].role !== 'user') msgs.shift();
    const reply = await AI.run('alfred', msgs, !!search);
    S.chat.push({role: 'assistant', content: reply}); cst.textContent = ''; speak(reply);
    if (promptKey === 'morning') { S.brief = {date: ymd(new Date()), ts: Math.floor(Date.now() / 1000), kind: 'ai', text: reply}; renderNext(); }
  } catch (e) { cst.textContent = 'Błąd: ' + e.message; S.chat.pop(); }
  busy = false; drawChat(); loadMeta();
}
async function chatToTasks() {
  if (busy) { toast('Alfred jeszcze odpowiada.'); return; }
  busy = true; const cst = $('cst'); cst.textContent = 'Alfred wybiera zadania z rozmowy…';
  try {
    const msgs = [...S.chat.slice(-20).map(m => ({role: m.role, content: m.content})), {role: 'user', content: S.prompts.tasks || ''}]; while (msgs.length && msgs[0].role !== 'user') msgs.shift();
    const j = JSON.parse(await AI.run('tasks', msgs, false)); cst.textContent = '';
    if (!j.tasks.length) toast(j.error || 'Alfred nie znalazł konkretnych zadań w tej rozmowie.');
    else { S.proposal = j.tasks.map(t => ({...t, on: true})); renderProposal(); }
  } catch (e) { cst.textContent = 'Błąd: ' + e.message; }
  busy = false;
}
function renderProposal() {
  const box = $('proposal'); if (!box) return; box.replaceChildren(); if (!S.proposal) return;
  const p = el('div', {class: 'prop'}, el('b', null, 'Proponowane zadania (odznacz zbędne):'));
  S.proposal.forEach(t => { const cb = el('input', {type: 'checkbox', style: 'width:16px;height:16px;flex:none'}); cb.checked = t.on; cb.addEventListener('change', () => { t.on = cb.checked; }); p.append(el('label', null, cb, el('span', null, `${t.text} `, el('span', {class: 'badge'}, `${t.min} min`), ' ', el('span', {class: 'badge'}, t.date)))); });
  p.append(el('div', {class: 'row', style: 'margin-top:8px'}, el('button', {class: 'btn p sm', type: 'button', onclick: () => { const add = S.proposal.filter(t => t.on); add.forEach(t => S.tasks.push({t: newId(), text: t.text, date: t.date, done: false, top: false, done_ts: null, min: t.min, ref: ''})); S.proposal = null; persist('alfred_tasks'); renderTasks(); renderProposal(); renderHero(); toast(`Dodano do planu: ${add.length}.`); }}, 'Dodaj zaznaczone do planu'), el('button', {class: 'btn sm', type: 'button', onclick: () => { S.proposal = null; renderProposal(); }}, 'Anuluj')));
  box.append(p);
}

// ----------------------------------------------------------------- tryb skupienia
let focusT = null;
function focusStart(t, mins) { S.focus = {t: t.t, title: t.text, end: Date.now() + mins * 60000, mins, over: false}; clearInterval(focusT); focusT = setInterval(renderFocus, 1000); renderFocus(); }
function focusStop() { S.focus = null; clearInterval(focusT); renderFocus(); }
function renderFocus() {
  const box = $('focus'), f = S.focus; if (!f) { box.className = ''; box.replaceChildren(); document.title = 'Dziś'; return; }
  const left = Math.max(0, Math.round((f.end - Date.now()) / 1000)), txt = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`;
  if (left === 0 && !f.over) { f.over = true; toast('Czas minął. Zrobione?'); }
  document.title = left ? `⏱ ${txt} · ${f.title.slice(0, 30)}` : 'Czas minął · Dziś';
  box.className = 'on' + (f.over ? ' end' : '');
  const t = taskById(f.t);
  box.replaceChildren(el('div', {class: 'in'}, el('span', {class: 'tm'}, f.over ? 'Koniec' : txt), el('span', {style: 'flex:1;min-width:120px'}, 'Skupienie: ', el('b', null, f.title)),
    t ? el('button', {class: 'btn p', type: 'button', onclick: () => { markDone(t); focusStop(); }}, 'Zrobione') : null, f.over ? el('button', {class: 'btn', type: 'button', onclick: () => focusStart(t || {t: f.t, text: f.title}, 10)}, '+10 min') : null, el('button', {class: 'btn', type: 'button', onclick: focusStop}, 'Zakończ')));
}

// ----------------------------------------------------------------- systemy (leniwie)
async function renderSystems() {
  const box = $('sysBody'); box.replaceChildren(el('p', {class: 'mut'}, 'Ładuję…'));
  const [bot, bk, ag] = await Promise.all([api('bot'), api('backup'), api('agenda')]); const st = bot && bot.status;
  const ago = s => s == null ? 'n/d' : s < 5400 ? Math.round(s / 60) + ' min temu' : s < 172800 ? Math.round(s / 3600) + ' h temu' : Math.round(s / 86400) + ' dni temu';
  const tile = (v, l, s, c) => el('div', null, el('b', {class: c || ''}, v), el('span', null, l), s ? el('small', {class: 'mut', style: 'display:block'}, s) : null);
  const tiles = [st ? tile(st.equity != null ? nf(st.equity) + ' USDT' : 'n/d', `bot (${st.mode || '?'})`, st.pnl_today != null ? `dziś ${st.pnl_today >= 0 ? '+' : '−'}${nf(Math.abs(st.pnl_today), 2)} USDT` : '') : tile('n/d', 'bot', 'brak danych'),
    bk && bk.ts ? tile(bk.age_s == null ? 'brak' : ago(bk.age_s), 'kopia zapasowa', bk.ok === false ? 'ostatnia próba nieudana' : '') : tile('nie ma', 'kopia zapasowa', 'Dysk Google nie podłączony', 'mut'),
    ag && ag.configured ? tile(ag.age_s == null ? 'brak' : ago(ag.age_s), 'kalendarz', ag.ok ? `${(ag.events || []).length} wydarzeń` : 'są błędy') : tile('nie ma', 'kalendarz', 'nie podłączony', 'mut'),
    S.ai ? tile(S.ai.ready ? 'działa' : 'wyłączony', 'Alfred (AI)', S.ai.search_limit != null ? `przeglądy internetu dziś: ${S.ai.search_left}/${S.ai.search_limit}` : '') : tile('n/d', 'Alfred (AI)', '')];
  const kids = [el('div', {class: 'kv', style: 'margin-top:8px'}, ...tiles)];
  const info = ((S.today && S.today.alerts) || []).filter(a => a.level === 'info'); if (info.length) { kids.push(el('h3', null, 'Podpowiedzi')); info.forEach(a => kids.push(el('p', {class: 'note', style: 'margin:3px 0'}, '• ' + a.text))); }
  kids.push(el('p', {class: 'note'}, 'Szczegóły bota: zakładka Bot. Kopia zapasowa i kalendarz: instrukcja serwera.'));
  box.replaceChildren(...kids);
}

// ----------------------------------------------------------------- start
function renderAll() { renderHero(); renderBanner(); renderAlerts(); renderNext(); renderPlan(); renderTasks(); renderHabits(); renderMoney(); renderMore(); }
async function loadToday() { const t = await api('today'); if (t) { S.today = t; if (S.offline) { S.offline = false; syncAll(); } } else { S.offline = true; retrySoon(); } renderBanner(); renderHero(); renderAlerts(); renderNext(); renderPlan(); renderMoney(); renderMore(); }
async function loadMeta() { const al = await api('alfred'); if (al) { S.ai = al.ai; S.prompts = al.prompts || {}; const sb = al.briefing; if (sb && sb.text && !(S.brief && S.brief.ts >= (sb.ts || 0))) S.brief = sb; renderNext(); } }
(async () => {
  renderAsk(); renderAll();
  const loaded = await Promise.all(Object.keys(KEYS).map(k => UD.load(k)));
  Object.keys(KEYS).forEach((k, i) => { S[KEYS[k][0]] = KEYS[k][1](loaded[i].value); if (loaded[i].offline) S.offline = true; });
  if (new Date().getHours() >= 19) $('more').open = true;
  renderAll(); await Promise.all([loadToday(), loadMeta()]);
  $('systems').addEventListener('toggle', () => { if ($('systems').open) renderSystems(); });
  setInterval(() => { renderHero(); }, 30000); setInterval(loadToday, 120000);
})();
})();
