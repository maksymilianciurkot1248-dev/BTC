<!doctype html>
<html lang="pl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0F16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Bitcoin — analiza</title>
<script>
try { var t = localStorage.getItem('btc-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
:root{
  --bg:#EDF0F4; --bg-glass:rgba(237,240,244,.82); --card:#FFFFFF; --card2:#F5F7FA; --line:#DCE2E9;
  --ink:#111D29; --muted:#5B6978; --accent:#E8830C; --accent2:#F5B040;
  --glow1:rgba(232,131,12,.16); --glow2:rgba(31,95,168,.14); --grid:rgba(17,29,41,.045);
  --price:#1F5FA8; --sma20:#C47A0C; --sma50:#7A4FA3; --sma200:#3A4756;
  --bull:#12805A; --bear:#C1334A; --neutral:#8794A2; --focus:#1B64C8;
  --shadow:0 1px 2px rgba(17,29,41,.05),0 10px 28px -14px rgba(17,29,41,.20);
  --sans:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --r:18px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F16; --bg-glass:rgba(10,15,22,.78); --card:#111A25; --card2:#16212E; --line:#223142;
    --ink:#E8EEF4; --muted:#93A1B1; --accent:#F7A234; --accent2:#FFC46B;
    --glow1:rgba(247,162,52,.16); --glow2:rgba(95,163,238,.14); --grid:rgba(232,238,244,.04);
    --price:#5FA3EE; --sma20:#E0A040; --sma50:#B792E0; --sma200:#AEB9C5;
    --bull:#3DD39A; --bear:#FF6B80; --neutral:#7E8B99; --focus:#7DB2F5;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -16px rgba(0,0,0,.65);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F16; --bg-glass:rgba(10,15,22,.78); --card:#111A25; --card2:#16212E; --line:#223142;
  --ink:#E8EEF4; --muted:#93A1B1; --accent:#F7A234; --accent2:#FFC46B;
  --glow1:rgba(247,162,52,.16); --glow2:rgba(95,163,238,.14); --grid:rgba(232,238,244,.04);
  --price:#5FA3EE; --sma20:#E0A040; --sma50:#B792E0; --sma200:#AEB9C5;
  --bull:#3DD39A; --bear:#FF6B80; --neutral:#7E8B99; --focus:#7DB2F5;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -16px rgba(0,0,0,.65);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-behavior:smooth}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.up{color:var(--bull)} .down{color:var(--bear)}
.tab{font-variant-numeric:tabular-nums}

/* tło */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.bg::before,.bg::after{content:"";position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);will-change:transform;animation:drift 32s ease-in-out infinite alternate}
.bg::before{background:radial-gradient(closest-side,var(--glow1),transparent);top:-28vmax;left:-18vmax}
.bg::after{background:radial-gradient(closest-side,var(--glow2),transparent);bottom:-34vmax;right:-22vmax;animation-delay:-11s}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000,transparent);mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000,transparent)}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vmax,4vmax,0) scale(1.12)}}

/* nagłówek */
.top{position:sticky;top:0;z-index:30;background:var(--bg-glass);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid var(--line)}
.top-in{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.15rem;
  background:linear-gradient(145deg,var(--accent2),var(--accent));box-shadow:0 4px 14px -4px var(--accent)}
.brand h1{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:.74rem;letter-spacing:.04em}
.mini{display:none;align-items:baseline;gap:8px;margin-left:8px;font-variant-numeric:tabular-nums;font-weight:650;animation:fadein .4s both}
.past-hero .mini{display:flex}
.mini span{font-size:.82rem;font-weight:600}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem;text-align:right}
.live{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bull);position:relative}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2.2s ease-out infinite}
.live.stale{background:var(--bear)}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.btn{font:inherit;font-size:.85rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,transform .2s,background .2s}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none}
.btn.pri{border-color:var(--accent);font-weight:600}
.btn:active{transform:scale(.96)}
.btn svg{width:14px;height:14px}
.btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* układ */
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 80px}
.stack{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.stack>*{grid-column:span 12;min-width:0}
@media (min-width:960px){.stack>.half{grid-column:span 6}}
section[id]{scroll-margin-top:84px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.card h2{font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.note{color:var(--muted);font-size:.86rem;margin-top:14px;max-width:75ch}
h3{font-size:.92rem;font-weight:650;margin:22px 0 6px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* pojawianie się */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0)*80ms)}
.reveal.in{opacity:1;transform:none}

/* hero */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center;padding:30px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 100% at 100% 0%,var(--glow1),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.coinline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.now{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;margin:14px 0 6px;font-size:clamp(2.7rem,8.5vw,4.6rem);line-height:1;font-weight:760;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.now .cur{font-size:1rem;font-weight:500;letter-spacing:0;color:var(--muted)}
.flash-up{animation:fu 1.4s ease-out}
.flash-down{animation:fd 1.4s ease-out}
@keyframes fu{0%{color:var(--bull)}100%{color:var(--ink)}}
@keyframes fd{0%{color:var(--bear)}100%{color:var(--ink)}}
.alts{display:flex;flex-wrap:wrap;gap:4px 20px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.alts b{color:var(--ink);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{font-weight:650}
.spark{display:block;width:100%;height:auto;color:var(--bull);overflow:visible}
.spark.down{color:var(--bear)}
.spark .sl{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark-area{opacity:0;transition:opacity 1.2s ease .5s}
.in .spark-area{opacity:1}
.spark-cap{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:6px}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px}
.kpi{padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .25s,border-color .25s;opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1),border-color .25s;transition-delay:calc(var(--i,0)*70ms),calc(var(--i,0)*70ms),0s}
.in .kpi{opacity:1;transform:none}
.in .kpi:hover{transform:translateY(-3px);border-color:var(--accent);transition-delay:0s}
.kpi .v{font-size:1.5rem;font-weight:720;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.2}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:1px}

/* nawigacja */
.nav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;color:var(--muted);text-decoration:none;font-size:.86rem;font-weight:550;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);transition:color .2s,border-color .2s,background .2s}
.nav a:hover{color:var(--ink);border-color:var(--accent)}

.banner{padding:12px 16px;border-radius:12px;border:1px solid var(--bear);border-left-width:5px;background:var(--card)}

/* kontrolki */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{font:inherit;font-size:.82rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.seg button:hover{color:var(--ink);border-color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.static{cursor:default}
.legend button[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.legend button[aria-pressed="true"]{background:transparent;color:var(--ink);border-color:var(--line)}
.sw{width:12px;height:3px;border-radius:2px;display:inline-block}

/* wykres */
.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 20px;margin-bottom:12px}
.cstats div{display:flex;flex-direction:column}
.cstats span{font-size:.76rem;color:var(--muted)}
.cstats b{font-size:1.05rem;font-weight:680;font-variant-numeric:tabular-nums}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none}
.axis{font:11px var(--sans);fill:var(--muted)}
.g{stroke:var(--line);stroke-width:1}
.l-price{stroke:var(--price);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.l-sma20{stroke:var(--sma20);stroke-width:1.5;fill:none}
.l-sma50{stroke:var(--sma50);stroke-width:1.5;fill:none}
.l-sma200{stroke:var(--sma200);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.t-sma20{fill:var(--sma20);font:600 11px var(--sans)}
.t-sma50{fill:var(--sma50);font:600 11px var(--sans)}
.t-sma200{fill:var(--sma200);font:600 11px var(--sans)}
.tagbg{fill:var(--price)} .tagtx{fill:var(--card);font:700 11px var(--sans)}
.lastline{stroke:var(--price);stroke-width:1;stroke-dasharray:2 4;opacity:.6}
.cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--price);stroke:var(--card);stroke-width:2.5}
.ext{fill:var(--card);stroke:var(--price);stroke-width:2}
.extl{font:600 11px var(--sans);fill:var(--ink)}
.pulse{fill:var(--price);transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.4);opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s cubic-bezier(.3,.6,.2,1)}
.draw.go{stroke-dashoffset:0}
.area.draw{stroke-dasharray:none;stroke-dashoffset:0;opacity:0;transition:opacity 1.4s ease .3s}
.area.draw.go{opacity:1}
.fade{animation:fadein 1s ease .9s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.8rem;line-height:1.55;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow);z-index:2}
.tip b{font-weight:650}
.tip .r{display:flex;justify-content:space-between;gap:16px}

/* zegary / mierniki */
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:26px 36px;align-items:center}
.gauge-wrap{max-width:290px;margin:0 auto;width:100%}
.gauge{display:block;width:100%;height:auto;color:var(--ink);overflow:visible}
.zone{opacity:.92}
.needle{transform:rotate(-90deg);transition:transform 1.6s cubic-bezier(.3,1.35,.5,1)}
.in .needle{transform:rotate(var(--rot))}
.gauge-c{text-align:center;margin-top:-2px}
.gauge-c b{display:block;font-size:2.1rem;font-weight:760;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge-c span{font-size:.84rem;color:var(--muted)}
.mb{margin-bottom:18px}
.mb .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-size:.88rem}
.mb .mh span{color:var(--muted)} .mb .mh b{font-variant-numeric:tabular-nums;font-weight:650}
.meter-track{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--bear),var(--neutral) 50%,var(--bull));opacity:.85}
.meter-track.plain{background:var(--line);opacity:1}
.meter-band{position:absolute;top:0;bottom:0;background:var(--price);opacity:.35;border-radius:99px}
.meter-pin{position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--ink);transform:translate(-50%,-50%);transition:left 1.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.in .meter-pin{left:var(--x)}
.meter-scale{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:99px;background:var(--price);transition:width 1.3s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*70ms)}
.in .fill{width:var(--w)}
.fill.bull{background:var(--bull)} .fill.bear{background:var(--bear)} .fill.accent{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.dbar{position:relative;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.dfill{position:absolute;top:0;bottom:0;left:var(--l);width:0;background:var(--price);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.in .dfill{width:var(--w)}
.dfill.bull{background:var(--bull)} .dfill.bear{background:var(--bear)}
.dmid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted);opacity:.6}
.drow{display:grid;grid-template-columns:5.4rem 1fr 4.6rem;gap:12px;align-items:center;margin-bottom:11px;font-size:.88rem}
.drow span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.drow span:first-child{color:var(--muted)}

/* bilans sygnałów */
.balance{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px;margin:18px 0 10px}
.balance span{display:block;flex:0 0 0;flex-grow:0;transition:flex-grow 1.3s cubic-bezier(.2,.8,.2,1)}
.in .balance span{flex-grow:var(--f)}
.s-plus{background:var(--bull)} .s-minus{background:var(--bear)} .s-zero{background:var(--neutral)}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.counts .pill b{color:var(--ink)}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:9.4rem 11rem 1fr;gap:4px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateX(-10px);transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i)*55ms)}
.in .ledger li{opacity:1;transform:none}
.ledger li:last-child{border-bottom:0}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:650;font-size:.84rem;padding:3px 11px;border-radius:999px;justify-self:start}
.v-plus{color:var(--bull);background:color-mix(in srgb,var(--bull) 13%,transparent)}
.v-minus{color:var(--bear);background:color-mix(in srgb,var(--bear) 13%,transparent)}
.v-zero{color:var(--muted);background:color-mix(in srgb,var(--neutral) 15%,transparent)}
.ledger .lbl{font-weight:600}
.ledger .detail{color:var(--muted);font-size:.9rem}

/* kafelki */
.sigs{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.sigs li{padding:11px 14px;border:1px solid var(--line);border-left:4px solid var(--neutral);border-radius:12px;background:var(--card2);font-size:.88rem}
.sigs li.bull{border-left-color:var(--bull)} .sigs li.bear{border-left-color:var(--bear)}
.sigs b{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.74rem;color:var(--muted)}
.srcs span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)} .srcs .bad{color:var(--bear);border-color:var(--bear)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:24px}
.tiles.small{margin-top:20px}
.tile{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card2);transition:border-color .25s,transform .25s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .l{font-size:.78rem;color:var(--muted)}
.tile .v{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 4px;letter-spacing:-.01em}
.tile .h{font-size:.78rem;color:var(--muted)}
.tile .bar,.tile .dbar{margin-top:8px}

/* fibonacci */
.fib{position:relative;height:330px;margin-top:4px}
.fl{position:absolute;left:0;right:0;top:calc(12px + (100% - 24px)*var(--f));height:0;border-top:1px dashed var(--line);transform-origin:left;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*70ms)}
.in .fl{transform:scaleX(1)}
.fl.edge{border-top-style:solid;border-top-color:var(--muted)}
.fl span{position:absolute;top:-10px;font-size:.78rem;background:var(--card);padding:0 8px;font-variant-numeric:tabular-nums;color:var(--muted)}
.fl .a{left:0}.fl .b{left:4.8rem;color:var(--ink);font-weight:600}

.cell{display:block;aspect-ratio:1;border-radius:5px;background:var(--c);opacity:var(--a);transition:transform .2s}

dl.rows{display:grid;grid-template-columns:1fr;margin:0}

.news{list-style:none;margin:0;padding:0;display:grid;gap:10px}

function countUp(el, to, d, o = {}) {
  const f = o.f || (v => fmt(v, d));
  el.textContent = f(to);
  if (!ok(to) || REDUCED || !o.animate) return;
  const from = ok(o.from) ? Number(o.from) : 0;
  if (from === to) return;
  const run = () => {
    const t0 = performance.now(), dur = o.dur || 1300;
    const step = t => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);

  if (o.now) run(); else { el.textContent = f(from); el.classList.add('cu'); el._run = run; }
}
const runCounts = root => root.querySelectorAll('.cu').forEach(x => { if (x._run) { const r = x._run; x._run = null; r(); } });

function observeReveals(root, instant) {
  if (io) { io.disconnect(); io = null; }

  if (instant || REDUCED || !('IntersectionObserver' in window)) {
    els.forEach(e => { e.classList.add('in'); runCounts(e); });

  els.forEach(e => io.observe(e));
}

  const gid = 'ag' + (++uid);
  const defs = S('defs'), lg = S('linearGradient', {id: gid, x1: 0, y1: 0, x2: 0, y2: 1});
  lg.append(S('stop', {offset: '0%', style: 'stop-color:var(--price);stop-opacity:.34'}), S('stop', {offset: '100%', style: 'stop-color:var(--price);stop-opacity:0'}));
  defs.append(lg); svg.append(defs);

  for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) {
    const y = Y(t);
    svg.append(S('line', {class: 'g', x1: pad.l, x2: W - pad.r, y1: y, y2: y}),
               S('text', {class: 'axis', x: pad.l - 8, y: y + 4, 'text-anchor': 'end'}, fmt(t, 0)));
  }
  const long = (n - start) > 120, ticks = narrow ? 3 : 5;
  for (let k = 0; k < ticks; k++) {
    const i = start + Math.round(k * (n - 1 - start) / (ticks - 1));
    const d = new Date(ser.date[i] + 'T00:00:00Z');
    const label = d.toLocaleDateString('pl-PL', long ? {month: 'short', year: '2-digit', timeZone: 'UTC'} : {day: 'numeric', month: 'short', timeZone: 'UTC'});
    svg.append(S('text', {class: 'axis', x: X(i), y: H - 6, 'text-anchor': k === 0 ? 'start' : k === ticks - 1 ? 'end' : 'middle'}, label));
  }
  const path = arr => {
    let d = '', pen = false;
    for (let i = start; i < n; i++) {
      const v = arr[i];
      if (v == null) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true;
    }
    return d;
  };
  /* wypełnienie pod ceną */
  const pts = [];
  for (let i = start; i < n; i++) if (ser.price[i] != null) pts.push(i);
  const base = H - pad.b;
  const areaD = pts.map((i, j) => (j ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(ser.price[i]).toFixed(1)).join('') + `L${X(pts[pts.length - 1]).toFixed(1)} ${base}L${X(pts[0]).toFixed(1)} ${base}Z`;
  const areaP = S('path', {class: 'area' + (anim ? ' draw' : ''), d: areaD, fill: `url(#${gid})`});
  svg.append(areaP);
  for (const k of ['sma200', 'sma50', 'sma20']) if (keys.includes(k)) svg.append(S('path', {class: 'l-' + k + (anim ? ' fade' : ''), d: path(ser[k])}));
  const lastP = ser.price[n - 1];
  svg.append(S('line', {class: 'lastline', x1: pad.l, x2: W - pad.r, y1: Y(lastP), y2: Y(lastP)}));
  /* poziomy Bybit: przerywane linie (poza zakresem przyklejone do krawędzi ze strzałką) */
  const lvG = S('g', {class: 'lvl'}), lvDraw = levels.map(l => {
    const y0 = Y(l.v), top = pad.t + 7, bot = H - pad.b - 7;
    return {...l, y: Math.min(bot, Math.max(top, y0)), off: y0 < top ? 'up' : y0 > bot ? 'down' : null};
  }).sort((a, b) => a.y - b.y);
  for (const l of lvDraw) {
    const [col, dash] = LVL[l.kind];
    lvG.append(S('line', {x1: pad.l, x2: W - pad.r, y1: l.y, y2: l.y, style: `stroke:${col};stroke-dasharray:${dash};opacity:${l.off ? .55 : .95}`}));
  }
  svg.append(lvG);
  const pricePath = S('path', {class: 'l-price' + (anim ? ' draw' : ''), d: path(ser.price), pathLength: '1'});
  svg.append(pricePath);

  /* przecięcia SMA50/SMA200 */
  const crosses = [];
  if (vis.sma50 && vis.sma200 && ser.sma50 && ser.sma200) {
    for (let i = Math.max(start, 1); i < n; i++) {
      const a0 = ser.sma50[i - 1], b0 = ser.sma200[i - 1], a1 = ser.sma50[i], b1 = ser.sma200[i];
      if ([a0, b0, a1, b1].some(v => v == null)) continue;
      const s0 = a0 - b0, s1 = a1 - b1;
      if (s0 <= 0 && s1 > 0) crosses.push({i, golden: true});
      else if (s0 >= 0 && s1 < 0) crosses.push({i, golden: false});
    }
    for (const c of crosses) {
      const x = X(c.i), y = Y(ser.sma200[c.i]);
      const dm = S('path', {d: `M${x} ${y - 7}L${x + 7} ${y}L${x} ${y + 7}L${x - 7} ${y}Z`, style: `fill:var(${c.golden ? '--bull' : '--bear'});stroke:var(--card);stroke-width:2`});
      dm.append(S('title', null, (c.golden ? 'Złoty krzyż' : 'Krzyż śmierci') + ' · ' + fmtDate(ser.date[c.i])));
      svg.append(dm);
    }
  }
  /* ekstrema w zakresie */
  let iMax = start, iMin = start;
  for (let i = start; i < n; i++) if (ser.price[i] != null) { if (ser.price[i] > ser.price[iMax]) iMax = i; if (ser.price[i] < ser.price[iMin]) iMin = i; }
  const extLabel = (i, above) => {
    const x = X(i), y = Y(ser.price[i]);
    const anchor = x < pad.l + 56 ? 'start' : x > W - pad.r - 56 ? 'end' : 'middle';
    svg.append(S('circle', {class: 'ext', cx: x, cy: y, r: 4}), S('text', {class: 'extl', x, y: above ? y - 10 : y + 18, 'text-anchor': anchor}, fmt(ser.price[i], 0)));
  };
  if (iMax !== n - 1) extLabel(iMax, true);
  if (iMin !== n - 1 && iMin !== iMax) extLabel(iMin, false);

  /* kropka na końcu i etykiety */
  const ex = X(n - 1), ey = Y(lastP);
  svg.append(S('circle', {class: 'pulse', cx: ex, cy: ey, r: 5}), S('circle', {class: 'dot', cx: ex, cy: ey, r: 4.5}));
  const labels = {price: fmt(lastP, 0), sma20: 'SMA20', sma50: 'SMA50', sma200: 'SMA200'};
  const ends = keys.filter(k => ser[k][n - 1] != null).map(k => ({k, y: Y(ser[k][n - 1])})).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 17) ends[i].y = ends[i - 1].y + 17;
  for (const e of ends) {
    if (e.k === 'price') {
      const w = labels.price.length * 7.2 + 14;
      svg.append(S('rect', {class: 'tagbg', x: ex + 8, y: e.y - 10, width: w, height: 20, rx: 10}), S('text', {class: 'tagtx', x: ex + 8 + w / 2, y: e.y + 4, 'text-anchor': 'middle'}, labels.price));
    } else svg.append(S('text', {class: 't-' + e.k, x: ex + 10, y: e.y + 4}, labels[e.k]));
  }

  /* etykiety poziomów Bybit (z rozsuwaniem, żeby się nie nakładały) */
  if (lvDraw.length) {
    const lab = lvDraw.map(l => ({l, y: l.y, t: (l.off === 'up' ? '▲ ' : l.off === 'down' ? '▼ ' : '') + (narrow ? l.short : l.long) + ' ' + fmt(l.v, 0)}));
    for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < 16) lab[i].y = lab[i - 1].y + 16;
    const shift = lab.length ? Math.max(0, lab[lab.length - 1].y - (H - pad.b - 4)) : 0;
    if (shift) lab.forEach(x => { x.y -= shift; });
    const lg_ = S('g', {class: 'lvl'});
    for (const x of lab) {
      const col = LVL[x.l.kind][0], w = x.t.length * 6.3 + 12;
      const r_ = S('rect', {x: pad.l + 6, y: x.y - 9, width: w, height: 17, rx: 8, style: `stroke:${col}`});
      const t_ = S('text', {x: pad.l + 12, y: x.y + 3.5, style: `fill:${col}`}, x.t);
      t_.append(S('title', null, `Bybit · ${x.l.long}: ${fmt(x.l.v, 2)} ${cur}`));
      lg_.append(r_, t_);
    }
    svg.append(lg_);
  }

  /* interakcja */
  const cross = S('line', {class: 'cross', y1: pad.t, y2: H - pad.b, visibility: 'hidden'});
  const dot = S('circle', {class: 'dot', r: 5, visibility: 'hidden'});
  const hit = S('rect', {x: pad.l, y: 0, width: W - pad.l - pad.r, height: H, fill: 'transparent'});
  const tip = h('div', {class: 'tip', hidden: 'true'});
  svg.append(cross, dot, hit);
  let curI = n - 1;
  const showAt = i => {
    i = clamp(i, start, n - 1); curI = i;
    const rect = svg.getBoundingClientRect(), k = rect.width / W;
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(ser.price[i])); dot.setAttribute('visibility', 'visible');
    const chg = ser.price[start] ? (ser.price[i] / ser.price[start] - 1) * 100 : null;
    const r_ = (a, b, c) => h('div', {class: 'r'}, h('span', null, a), h('b', {class: c || ''}, b));
    tip.replaceChildren(h('b', null, fmtDate(ser.date[i])), r_('Cena', fmt(ser.price[i], 0) + ' ' + cur), r_('Od początku zakresu', pct(chg), sign(chg)),
      ...['sma20', 'sma50', 'sma200'].filter(kk => vis[kk] && ser[kk] && ser[kk][i] != null).map(kk => r_(kk.toUpperCase().replace('SMA', 'SMA '), fmt(ser[kk][i], 0))));
    tip.hidden = false;
    const left = X(i) * k;
    tip.style.left = Math.max(0, (left > rect.width * 0.55 ? left - tip.offsetWidth - 14 : left + 14)) + 'px';
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const move = e => {
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (W / rect.width);
    showAt(Math.round(start + (px - pad.l) / (W - pad.l - pad.r) * (n - 1 - start)));
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', hide);
  svg.addEventListener('keydown', e => {
    const big_ = e.shiftKey ? 7 : 1;
    if (e.key === 'ArrowLeft') { showAt(curI - big_); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { showAt(curI + big_); e.preventDefault(); }
    else if (e.key === 'Home') { showAt(start); e.preventDefault(); }
    else if (e.key === 'End') { showAt(n - 1); e.preventDefault(); }
    else if (e.key === 'Escape') hide();
  });
  svg.addEventListener('blur', hide);
  box.append(svg, tip);

  if (anim) {
    raf2(() => { pricePath.classList.add('go'); areaP.classList.add('go'); });
    pricePath.addEventListener('transitionend', () => pricePath.classList.remove('draw', 'go'), {once: true});
  }

  /* statystyki nad wykresem */
  if (chartStats) {
    const first = ser.price[start], chg = first ? (lastP / first - 1) * 100 : null;
    const item = (l, v, c) => h('div', null, h('span', null, l), h('b', {class: c || ''}, v));
    chartStats.replaceChildren(
      item('Zmiana w zakresie', arrow(chg) + ' ' + pct(chg), sign(chg)),
      item('Maksimum', fmt(ser.price[iMax], 0) + ' ' + cur),
      item('Minimum', fmt(ser.price[iMin], 0) + ' ' + cur),
      item('Rozstęp max/min', first ? fmt((ser.price[iMax] / ser.price[iMin] - 1) * 100, 1) + '%' : 'n/d'));
  }
  if (chartNote) {
    const parts = [];
    if (crosses.length) parts.push('Przecięcia SMA50 i SMA200 w zakresie: ' + crosses.map(c => (c.golden ? 'złoty krzyż ' : 'krzyż śmierci ') + fmtDate(ser.date[c.i])).join(', ') + '. Oznaczone rombami na wykresie.');
    const nb = lvDraw.filter(x => x.src === 'bb').length, np = lvDraw.length - nb;
    if (nb) parts.push('Przerywane linie to poziomy z Bybit (wejście, likwidacja, TP/SL i oczekujące zlecenia).');
    if (np) parts.push('Linie kreska-kropka to propozycja planera: wejście, stop i cele TP1/TP2.');
    if (lvDraw.some(x => x.off)) parts.push('Strzałka ▲/▼ oznacza poziom poza widocznym zakresem cen.');
    if (!nb && report.bybit && report.bybit.privacy !== 'full' && (report.bybit.positions || []).length) parts.push('Poziomy Bybit na wykresie wymagają BYBIT_PRIVACY=full (patrz sekcja Pozycje).');
    chartNote.textContent = parts.join(' ');
    chartNote.style.display = parts.length ? '' : 'none';
  }
}

/* ---------- sygnały ---------- */
function verdictSection(r) {
  const sg = (r.analysis && r.analysis.signals) || [];
  if (!sg.length) return null;
  const cnt = {'+': 0, '-': 0, '0': 0};
  sg.forEach(s => { cnt[s.verdict] = (cnt[s.verdict] || 0) + 1; });
  const total = sg.length, net = cnt['+'] - cnt['-'];
  const value = 50 + (net / total) * 50;
  const word = value >= 66 ? 'Przewaga byków' : value <= 34 ? 'Przewaga niedźwiedzi' : 'Układ mieszany';
  const cls = value >= 66 ? 'up' : value <= 34 ? 'down' : '';
  const center = h('b', {class: cls});
  countUp(center, net, 0, {f: v => (Math.round(v) > 0 ? '+' : Math.round(v) < 0 ? '−' : '') + Math.abs(Math.round(v)), animate: ANIM, dur: 1500});
  const g = gauge({min: 0, max: 100, value, center, label: word + ' · saldo sygnałów',
    zones: [{from: 0, to: 33, c: '--bear'}, {from: 33.8, to: 66, c: '--neutral'}, {from: 66.8, to: 100, c: '--bull'}],
    aria: `Wskaźnik sentymentu: ${cnt['+']} bycze, ${cnt['-']} niedźwiedzie, ${cnt['0']} neutralne`});
  const bal = h('div', {class: 'balance', role: 'img', 'aria-label': `${cnt['+']} bycze, ${cnt['-']} niedźwiedzie, ${cnt['0']} neutralne`},
    ['+', '0', '-'].map(v => cnt[v] ? h('span', {class: 's-' + {'+': 'plus', '-': 'minus', '0': 'zero'}[v], style: `--f:${cnt[v]}`}) : null));
  const counts = h('div', {class: 'counts'}, ['+', '0', '-'].map(v => h('span', {class: 'pill'}, h('span', {class: SIG[v][0].replace('v-', '') === 'plus' ? 'up' : SIG[v][0] === 'v-minus' ? 'down' : ''}, SIG[v][1]), SIG[v][2], h('b', null, cnt[v]))));
  const ledger = h('ul', {class: 'ledger'}, sg.map((s, i) => {

  }));
  return card({id: 'sec-sygnaly', title: 'Bilans sygnałów', sub: `${total} reguł heurystycznych: wskaźniki techniczne i nagłówki newsów`},
    h('div', {class: 'split'}, h('div', null, g, bal, counts), ledger),
    h('p', {class: 'note'}, 'Reguły heurystyczne oparte na wskaźnikach i nagłówkach newsów. To opis obecnej sytuacji, nie prognoza.'));
}

/* ---------- wskaźniki ---------- */

  const tiles = [];

  tiles.push(tile('Zmienność roczna', plain(a.vol30), 'całość okresu: ' + plain(a.vol_all), ok(a.vol30) ? bar(a.vol30 / 1.2, 'accent') : null));
  tiles.push(tile('Obsunięcie od szczytu', rpct(a.current_drawdown), 'maksymalne: ' + rpct(a.max_drawdown), ok(a.current_drawdown) && ok(a.max_drawdown) && a.max_drawdown ? bar(Math.abs(a.current_drawdown / a.max_drawdown), 'bear') : null, 'down'));
  if (ok(a.var95)) tiles.push(tile('VaR 95% (1 dzień)', '−' + fmt(a.var95 * 100) + '%', 'w 95% dni strata nie powinna być większa'));
  tiles.push(tile('Najlepszy / najgorszy dzień', h('span', null, h('span', {class: 'up'}, rpct(a.best_day)), ' / ', h('span', {class: 'down'}, rpct(a.worst_day)))));
  if (ok(a.positive_days_share)) tiles.push(tile('Dni na plusie', plain(a.positive_days_share, 0), null, bar(a.positive_days_share, 'bull')));
  if (ok(a.volume_ratio_7_30)) tiles.push(tile('Wolumen 7 dni / średnia 30', fmt(a.volume_ratio_7_30) + '×', a.volume_ratio_7_30 > 1 ? 'obroty powyżej normy' : 'obroty poniżej normy', bar(a.volume_ratio_7_30 / 2, 'accent')));
  if (a.ohlc && ok(a.ohlc.atr14)) tiles.push(tile('ATR (14, świece 4 godz.)', fmt(a.ohlc.atr14, 0) + ' ' + cur, ok(price) ? 'ok. ' + fmt(a.ohlc.atr14 / price * 100, 2) + '% ceny' : null));
  return card({id: 'sec-techniczne', title: 'Wskaźniki techniczne', sub: 'Momentum, zmienność i ryzyko'},
    (left || ms.length) ? h('div', {class: 'split'}, left || h('div'), h('div', null, ms)) : null,
    h('div', {class: 'tiles'}, tiles));
}
function fibSection(r) {
  const f = r.analysis && r.analysis.fib;
  if (!f || !f.levels || !ok(f.high) || !ok(f.low)) return null;
  const price = priceOf(r);
  const lv = Object.entries(f.levels).filter(([, v]) => ok(v)).map(([k, v]) => ({k, v: Number(v)}));
  const all = [...lv.map(x => x.v), Number(f.high), Number(f.low)]; if (ok(price)) all.push(Number(price));
  const hi = Math.max(...all), lo = Math.min(...all), sp = (hi - lo) || 1, fr = v => ((hi - v) / sp).toFixed(4);
  const lines = [{k: 'Szczyt', v: Number(f.high), edge: true}, ...lv.map(x => ({k: x.k.replace('.', ','), v: x.v})), {k: 'Dołek', v: Number(f.low), edge: true}];
  const ladder = h('div', {class: 'fib'},
    lines.map((x, i) => h('div', {class: 'fl' + (x.edge ? ' edge' : ''), style: `--f:${fr(x.v)};--i:${i}`}, h('span', {class: 'a'}, x.k), h('span', {class: 'b'}, fmt(x.v, 0)))),
    ok(price) ? h('div', {class: 'fp', style: `--f:${fr(Number(price))}`}, h('span', null, fmt(price, 0))) : null);
  return card({id: 'sec-fib', title: 'Poziomy Fibonacciego', sub: 'Ostatnie 90 dni, pomarańczowa linia to aktualna cena', cls: 'half'}, ladder);
}
function compareSection(r) {

  const row = (l, v) => h('div', {class: 'mb'}, h('div', {class: 'mh'}, h('span', null, l), h('b', {class: ok(v) ? sign(v) : ''}, fmt(v))), divbar(ok(v) ? v : 0, 'accent'),
    h('div', {class: 'meter-scale'}, h('span', null, '−1 odwrotnie'), h('span', null, '0'), h('span', null, '+1 zgodnie')));
  return card({id: 'sec-korelacja', title: 'Korelacja z ' + cap(c.id), sub: 'Dzienne zwroty BTC względem ' + cap(c.id), cls: 'half'},
    row('Cała historia', c.corr_all), row('Ostatnie 30 dni', c.corr_30d),
    h('div', {class: 'tiles small'},
      tile('Beta ' + cap(c.id) + ' vs BTC', fmt(c.beta_vs_btc)),
      tile('Zmiana 30 dni: BTC', rpct(c.btc_30d), null, null, sign(c.btc_30d)),
      tile('Zmiana 30 dni: ' + cap(c.id), rpct(c.other_30d), null, null, sign(c.other_30d))));
}

/* ---------- analiza zwrotów z serii ---------- */
function returnsFrom(ser) {
  const p = ser.price, d = ser.date, out = [];
  for (let i = 1; i < p.length; i++) if (p[i] != null && p[i - 1]) out.push({date: d[i], r: p[i] / p[i - 1] - 1});
  return out;
}
function histCard(rets, a) {
  const abs = rets.map(x => Math.abs(x.r)).sort((x, y) => x - y);
  const q = abs[Math.min(abs.length - 1, Math.floor(abs.length * 0.98))] || 0.01;
  const lim = Math.max(0.01, Math.ceil(q * 200) / 200), B = 21, w = 2 * lim / B;

/* wykres wielu serii: legenda osobno, tu oś, linie, podpowiedź (mysz, dotyk i klawiatura) i etykiety końcówek */
function mline(o) {
  const box = h('div', {class: 'mchart'}), ser = o.series, n = o.t.length;
  let W = 0;
  const build = w => {
    W = w;
    const H = Math.round(clamp(W * 0.42, 240, 380)), direct = W >= 520 && ser.length <= 4, pl = 54, pr = direct ? 124 : 14, pt = 12, pb = 26;
    const all = ser.flatMap(s => s.v);
    let lo = Math.min(...all, ...(ok(o.base) ? [o.base] : [])), hi = Math.max(...all, ...(ok(o.base) ? [o.base] : []));
    const tr = o.log ? (v => Math.log(Math.max(v, 0.01))) : (v => v);
    if (o.zeroTop) hi = 0;
    let tlo = tr(lo), thi = tr(hi);
    const padv = (thi - tlo) * 0.05 || 1;
    tlo -= padv; if (!o.zeroTop) thi += padv;
    const X = i => pl + (n < 2 ? 0 : i / (n - 1)) * (W - pl - pr), Y = v => pt + (thi - tr(v)) / (thi - tlo) * (H - pt - pb);
    const svg = S('svg', {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': o.aria, tabindex: 0});
    let ticks = [];
    if (o.log) {
      const mk = ms => { const a = []; for (let e = Math.floor(Math.log10(Math.max(lo, 0.01))) - 1; e <= Math.ceil(Math.log10(Math.max(hi, 0.02))) + 1; e++) for (const m of ms) { const v = m * 10 ** e; if (v >= lo * 0.9 && v <= hi * 1.1) a.push(v); } return a; };
      ticks = mk([1, 2, 5]);
      if (ticks.length > 7) ticks = mk([1, 3]);
      if (ticks.length > 7) ticks = mk([1]);
    } else {
      const step = niceStep((hi - lo) / 4);
      for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(Math.abs(v) < 1e-9 ? 0 : v);
    }
    for (const v of ticks) svg.append(S('line', {class: 'g', x1: pl, x2: W - pr, y1: Y(v), y2: Y(v)}), S('text', {class: 'axis', x: pl - 6, y: Y(v) + 4, 'text-anchor': 'end'}, o.fmtY(v)));
    if (ok(o.base)) svg.append(S('line', {x1: pl, x2: W - pr, y1: Y(o.base), y2: Y(o.base), style: 'stroke:var(--muted);stroke-width:1.2'}));
    let lastX = -99;
    for (let i = 0; i < n; i++) if (i === 0 || o.t[i].slice(0, 4) !== o.t[i - 1].slice(0, 4)) {
      const x = X(i);
      if (x - lastX < 40) continue;

      svg.append(S('text', {class: 'axis', x, y: H - 7, 'text-anchor': i === 0 ? 'start' : 'middle'}, yearTick(o.t[i])));
    }
    for (const s of ser) {
      svg.append(S('path', {class: 'ml', d: s.v.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(''), style: `stroke:${s.color}`}));
      svg.append(S('circle', {cx: X(n - 1), cy: Y(s.v[n - 1]), r: 3.6, style: `fill:${s.color};stroke:var(--card);stroke-width:2`}));
    }
    if (direct) {
      const ls = ser.map(s => ({s, y: Y(s.v[n - 1])})).sort((a, b) => a.y - b.y);
      for (let k = 1; k < ls.length; k++) if (ls[k].y - ls[k - 1].y < 15) ls[k].y = ls[k - 1].y + 15;
      for (const l of ls) svg.append(S('line', {x1: W - pr + 8, x2: W - pr + 20, y1: l.y, y2: l.y, style: `stroke:${l.s.color};stroke-width:2.4;stroke-linecap:round`}),
        S('text', {class: 'axis', x: W - pr + 25, y: l.y + 4, style: 'fill:var(--ink)'}, l.s.short || LAB_SHORT[l.s.id] || l.s.name));
    }
    const cross = S('line', {class: 'cross', y1: pt, y2: H - pb, visibility: 'hidden'});
    const hit = S('rect', {x: pl, y: 0, width: W - pl - pr, height: H, fill: 'transparent'});
    svg.append(cross, hit);
    const tip = h('div', {class: 'tip', hidden: true, role: 'status'});
    let cur = n - 1;

      cur = clamp(i, 0, n - 1);

      const sorted = ser.slice().sort((a, b) => b.v[cur] - a.v[cur]);
      put(tip, h('div', {class: 'd'}, fmtDate(o.t[cur])), sorted.map(s => h('div', {class: 'tr'}, h('i', {style: `background:${s.color}`}), h('span', null, s.name), h('b', null, o.fmtTip(s.v[cur])))));
      tip.hidden = false;
      const xp = X(cur), tw = tip.offsetWidth;
      tip.style.left = Math.max(0, xp > W * 0.55 ? xp - tw - 14 : xp + 14) + 'px';
    };
    const hide = () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    hit.addEventListener('pointermove', e => { const rc = svg.getBoundingClientRect(); show(Math.round((((e.clientX - rc.left) * (W / rc.width)) - pl) / (W - pl - pr) * (n - 1))); });

    svg.addEventListener('keydown', e => {

    svg.addEventListener('blur', hide);

/* ---------- kalkulator pozycji ---------- */
const calcNum = s => { const x = Number(String(s == null ? '' : s).replace(/\s/g, '').replace(',', '.')); return String(s == null ? '' : s).trim() === '' || !Number.isFinite(x) ? NaN : x; };
const calcUi = (() => {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('btc-calc') || '{}') || {}; } catch (e) { s = {}; }
  const cap = calcNum(s.cap), risk = calcNum(s.risk), lev = calcNum(s.lev);
  return {cap: cap > 0 ? String(cap) : '10000', risk: risk > 0 && risk <= 100 ? String(risk) : null, lev: [1, 2, 3, 5, 10, 20, 25].includes(lev) ? lev : 5, side: 'long', entry: '', stop: '', tp1: '', tp2: '', sig: null};
})();
const calcSave = () => {
  const cap = calcNum(calcUi.cap), risk = calcNum(calcUi.risk);
  try { localStorage.setItem('btc-calc', JSON.stringify({cap: cap > 0 ? cap : null, risk: risk > 0 && risk <= 100 ? risk : null, lev: calcUi.lev})); } catch (e) { /* tryb prywatny: pomijamy */ }
};
const CALC_MMR = 0.005, CALC_FEE = 0.00055;

function calcPos(v) {
  const e = v.entry, s = v.stop, long = v.side === 'long', errs = [], warns = [];
  if (!(v.cap > 0)) errs.push('Podaj kapitał większy od zera.');
  if (!(v.risk > 0 && v.risk <= 100)) errs.push('Ryzyko na transakcję musi mieścić się w zakresie 0–100%.');
  if (!(e > 0) || !(s > 0)) errs.push('Podaj cenę wejścia i cenę stopa.');
  else if (long ? s >= e : s <= e) errs.push(long ? 'W pozycji long stop musi leżeć poniżej wejścia.' : 'W pozycji short stop musi leżeć powyżej wejścia.');
  if (errs.length) return {errs};
  const risk$ = v.cap * v.risk / 100, d = Math.abs(e - s), dPct = d / e * 100, qty = risk$ / d, nom = qty * e, lev = v.lev, margin = nom / lev;
  const liq = long ? (lev <= 1 ? null : e * (1 - 1 / lev + CALC_MMR)) : e * (1 + 1 / lev - CALC_MMR);
  const liqDist = liq == null ? null : Math.abs(e - liq) / e * 100;
  const liqState = liq == null ? 'ok' : liqDist <= dPct ? 'bad' : liqDist < 1.5 * dPct ? 'warn' : 'ok';
  const levMax = Math.max(1, Math.floor(1 / (1.5 * d / e + CALC_MMR)));
  const dir = long ? 1 : -1, tp = (x, nm) => {
    if (!(x > 0)) return null;
    if (dir * (x - e) <= 0) { warns.push(`${nm} leży po złej stronie wejścia i został pominięty.`); return null; }
    return {px: x, r: Math.abs(x - e) / d, gain: qty * 0.5 * Math.abs(x - e)};
  };
  const t1 = tp(v.tp1, 'TP1'), t2 = tp(v.tp2, 'TP2');
  if (margin > v.cap) warns.push(`Wymagany margin (${fmt(margin, 0)}) przekracza kapitał (${fmt(v.cap, 0)}). Zmniejsz ryzyko albo zwiększ dźwignię.`);
  if (liqState === 'bad') warns.push('Cena likwidacji leży bliżej niż stop: pozycja zostałaby zlikwidowana, zanim stop zdążyłby zadziałać. Zmniejsz dźwignię.');
  else if (liqState === 'warn') warns.push('Zapas między stopem a likwidacją jest mały (mniej niż 1,5 razy odległość stopa). Przy poślizgu stop może nie zdążyć.');
  return {risk$, d, dPct, qty, nom, margin, liq, liqDist, liqState, levMax, t1, t2, fees: nom * CALC_FEE * 2, errs, warns};
}

function calcCard(r) {
  const pl = r.planner || {}, price = ok(pl.price) ? Number(pl.price) : Number(priceOf(r));
  const plan = pl.status === 'ok' ? pl.plan : null;
  if (!(price > 0) && !plan) return null;
  const planSig = plan ? [plan.date, plan.action, Math.round(plan.entry || 0)].join('|') : 'none';
  const seed = () => {

    else if (price > 0) Object.assign(calcUi, {entry: String(Math.round(price)), stop: String(Math.round(price * (calcUi.side === 'short' ? 1.03 : 0.97))), tp1: '', tp2: ''});
  };
  if (calcUi.sig !== planSig) { seed(); calcUi.sig = planSig; }
  if (!calcUi.risk) calcUi.risk = String((pl.params && pl.params.risk_pct) || 1);
  const out = h('div'), form = h('div', {class: 'calc'});

    inp.addEventListener('input', () => { calcUi[key] = inp.value; if (key === 'cap' || key === 'risk') { calcSave(); } draw(); });
    return h('label', {class: 'f'}, label, inp);
  };
  const lev = h('select', null, [1, 2, 3, 5, 10, 20, 25].map(x => h('option', {value: String(x), selected: x === calcUi.lev}, x + '×')));
  lev.addEventListener('change', () => { calcUi.lev = Number(lev.value); calcSave(); draw(); });

    return b;
  });
  const useBtn = h('button', {type: 'button', class: 'btn', disabled: !plan || plan.action === 'wait'}, 'Wstaw poziomy z planu analizatora');
  useBtn.addEventListener('click', () => { seed(); put(form, formKids()); draw(); });
  const formKids = () => [field('Kapitał (USDT)', 'cap'), field('Ryzyko na transakcję (%)', 'risk'), h('label', {class: 'f'}, 'Dźwignia', lev),
    field('Wejście', 'entry'), field('Stop Loss', 'stop'), field('TP1 (50% pozycji)', 'tp1'), field('TP2 (reszta)', 'tp2')];
  put(form, formKids());
  const draw = () => {
    const v = {cap: calcNum(calcUi.cap), risk: calcNum(calcUi.risk), lev: calcUi.lev, side: calcUi.side, entry: calcNum(calcUi.entry), stop: calcNum(calcUi.stop), tp1: calcNum(calcUi.tp1), tp2: calcNum(calcUi.tp2)};
    const c = calcPos(v);
    if (c.errs.length) { put(out, h('ul', {class: 'calcmsg'}, c.errs.map(x => h('li', null, x)))); return; }
    const long = v.side === 'long', liqTxt = c.liq == null ? 'brak (long bez dźwigni)' : fmt(c.liq, 0);
    const liqBadge = h('span', {class: 'badge ' + (c.liqState === 'bad' ? 'v-minus' : c.liqState === 'warn' ? 'v-warn' : 'v-plus')},
      c.liqState === 'bad' ? '✗ przed stopem' : c.liqState === 'warn' ? '! mały zapas' : '✓ za stopem');
    const sum = c.t1 || c.t2 ? (c.t1 ? c.t1.gain : 0) + (c.t2 ? c.t2.gain : 0) : null;
    const tiles = [
      tile('Ryzyko przy stopie', fmt(c.risk$, 2) + ' USDT', fmt(v.risk, 2) + '% kapitału (bez opłat)', null, 'down'),
      tile('Odległość do stopa', fmt(c.dPct, 2) + '%', fmt(c.d, 0) + ' USDT na 1 BTC'),
      tile('Rozmiar pozycji', fmt(c.qty, 4) + ' BTC', `nominał ${fmt(c.nom, 0)} USDT (${fmt(c.nom / v.cap * 100, 0)}% kapitału)`),
      tile('Wymagany margin', fmt(c.margin, 0) + ' USDT', `${fmt(c.margin / v.cap * 100, 0)}% kapitału przy ${v.lev}×`, bar(c.margin / v.cap, c.margin > v.cap ? 'bear' : c.margin / v.cap > 0.5 ? 'accent' : 'bull')),
      tile('Szacowana likwidacja', h('span', null, liqTxt), c.liq == null ? 'tryb izolowany' : `${fmt(c.liqDist, 1)}% od wejścia, stop ${fmt(c.dPct, 1)}%`, h('div', {style: 'margin-top:8px'}, liqBadge)),
      tile('Najwyższa rozsądna dźwignia', '≈ ' + c.levMax + '×', 'likwidacja co najmniej 1,5 razy dalej niż stop'),
      c.t1 ? tile('Zysk przy TP1', '+' + fmt(c.t1.gain, 2) + ' USDT', `${fmt(c.t1.r, 1)}R, zamknięcie 50% pozycji`, null, 'up') : null,
      c.t2 ? tile('Zysk przy TP2', '+' + fmt(c.t2.gain, 2) + ' USDT', `${fmt(c.t2.r, 1)}R, druga połowa pozycji`, null, 'up') : null,
      sum != null ? tile('Cały plan zrealizowany', '+' + fmt(sum, 2) + ' USDT', `${fmt(sum / v.cap * 100, 2)}% kapitału; stosunek 1 : ${fmt(sum / c.risk$, 2)}`, null, 'up') : null,
      tile('Opłaty (szacunek)', '≈ ' + fmt(c.fees, 2) + ' USDT', 'wejście i wyjście po 0,055% (taker)'),
    ].filter(Boolean);
    put(out, c.warns.length ? h('ul', {class: 'calcmsg warn'}, c.warns.map(x => h('li', null, x))) : null, h('div', {class: 'tiles small'}, tiles),
      h('p', {class: 'note'}, `Likwidacja jest szacowana dla marginu izolowanego i stawki utrzymania ${fmt(CALC_MMR * 100, 1)}%, bez opłat i funding. Prawdziwa cena zależy od konta i trybu marginu, więc sprawdź ją na giełdzie przed złożeniem zlecenia.`));
  };
  draw();
  return card({id: 'sec-kalk', title: 'Kalkulator pozycji i ryzyka', sub: 'Ile kupić, żeby stop kosztował tyle, ile zakładasz · liczone w przeglądarce'},
    h('div', {class: 'seg', role: 'group', 'aria-label': 'Kierunek pozycji', style: 'margin-bottom:12px'}, sideBtns),

/* ---------- decyzja na dziś: wstrzymać się, long czy short ---------- */
function decisionCard(r) {
  const pl = r.planner, p = pl && pl.status === 'ok' && pl.plan && ['long', 'short', 'wait'].includes(pl.plan.action) ? pl.plan : null;
  const sg = (r.analysis && r.analysis.signals) || [];
  const cnt = {'+': 0, '-': 0, '0': 0};
  sg.forEach(s => { cnt[s.verdict] = (cnt[s.verdict] || 0) + 1; });
  const total = sg.length, net = cnt['+'] - cnt['-'], bal = total ? 50 + net / total * 50 : null;
  const balAct = bal == null ? null : bal >= 66 ? 'long' : bal <= 34 ? 'short' : 'wait';
  const act = p ? p.action : balAct;
  if (!act) return null;
  const lab = pl && pl.lab, rk = (lab && lab.risk) || {};
  const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
  const TITLE = {wait: 'WSTRZYMAJ SIĘ', long: 'LONG (kupno)', short: 'SHORT (sprzedaż)'};
  const brk = p && p.entry_type === 'stop';
  let sub, sub2 = null;
  if (p && act === 'wait') {
    const w = p.waiting_for && p.waiting_for.length ? p.waiting_for[0].text : null;
    sub = 'Plan analizatora nie widzi dziś dobrego wejścia.' + (w ? ' Czekam na: ' + plnum(w) + '.' : '');
  } else if (p) {
    sub = `Plan analizatora: ${brk ? 'zlecenie warunkowe po wybiciu' : 'zlecenie limit'} po ${px0(p.entry)}, stop ${px0(p.stop)}.`;
    sub2 = p.live_text ? plnum(p.live_text) : null;
  } else {
    sub = `Planer jest niedostępny, więc kierunek wynika tylko z bilansu sygnałów (saldo ${sgn(net)} z ${total} reguł). To dużo słabsza podstawa niż plan z poziomami wejścia i stopem.`;
  }
  const conf = p && act !== 'wait' ? p.confidence : null;
  const side = h('div', {class: 'conf'},
    ok(conf)
      ? [h('div', {class: 'mh'}, h('span', null, 'Pewność heurystyki (' + (conf >= 75 ? 'wysoka' : conf >= 65 ? 'średnia' : 'niska') + ')'), h('b', null, conf + '%')), bar(conf / 100, conf >= 75 ? 'bull' : 'accent'),
        h('div', {class: 'note', style: 'margin-top:6px;font-size:.76rem'}, 'To wynik reguł, a nie prawdopodobieństwo zysku. Procenty szans dla wybranego okresu policzy kalkulator.')]
      : bal != null
        ? [h('div', {class: 'mh'}, h('span', null, 'Bilans sygnałów'), h('b', null, sgn(net))), bar(bal / 100, bal >= 66 ? 'bull' : bal <= 34 ? 'bear' : 'accent'),
          h('div', {class: 'note', style: 'margin-top:6px;font-size:.76rem'}, `▲ ${cnt['+']} bycze · ● ${cnt['0']} neutralne · ▼ ${cnt['-']} niedźwiedzie`)]
        : null);
  const top = h('div', {class: 'plan-top'}, h('div', {class: 'plan-act'}, TITLE[act], h('small', null, sub), sub2 ? h('small', {style: 'color:var(--ink)'}, sub2) : null), side);
  let ticket = null;
  if (p && act !== 'wait') {
    ticket = h('div', {class: 'ticket'},
      h('div', {class: 'en'}, h('span', null, brk ? 'Wejście (po wybiciu)' : 'Wejście (limit)'), h('b', null, px0(p.entry))),
      h('div', {class: 'sl'}, h('span', null, 'Stop Loss'), h('b', null, px0(p.stop)), h('small', null, `ryzyko ${fmt(p.risk_px_pct, 1)}% ceny`)),
      h('div', {class: 'tp'}, h('span', null, 'TP1 / TP2'), h('b', null, px0(p.tp1) + ' / ' + px0(p.tp2)), h('small', null, `${fmt(p.r1, 1)}R / ${fmt(p.r2, 1)}R`)),
      h('div', null, h('span', null, 'Propozycja ważna do'), h('b', null, fdt(p.valid_until_ms))));
  }
  const reasons = p ? (p.reasons || []).slice(0, act === 'wait' ? 2 : 1) : [];
  const cautions = p ? (p.cautions || []).slice() : [];
  const regime = rk.regime;
  if (act === 'long' && regime === 'bessa') cautions.push('Long wbrew trendowi długoterminowemu: cena i SMA50 leżą pod SMA200 (bessa). Takie zagrania mają zwykle gorszy bilans.');
  if (act === 'short' && regime === 'hossa') cautions.push('Short wbrew trendowi długoterminowemu: cena i SMA50 leżą nad SMA200 (hossa). Takie zagrania mają zwykle gorszy bilans.');
  if (rk.level === 'wysokie') cautions.push('Ryzyko rynku jest wysokie (duża zmienność lub głębokie obsunięcie od szczytu). Rozważ mniejszy rozmiar pozycji.');
  const lists = [reasons.length ? h('ul', {class: 'why' + (act === 'wait' ? ' wait' : '')}, reasons.map(x => h('li', null, plnum(x)))) : null,
    cautions.length ? h('ul', {class: 'why warn'}, cautions.map(x => h('li', null, plnum(x)))) : null];
  const t200 = lab && (lab.plans || []).find(x => x.id === 'trend200'), tt = t200 && t200.today;
  const lvlCls = {niskie: 'v-plus', umiarkowane: 'v-zero', 'podwyższone': 'v-warn', wysokie: 'v-minus'}[rk.level] || 'v-zero';
  const REG = {hossa: ['Hossa', 'up'], bessa: ['Bessa', 'down'], 'przejściowy': ['Przejściowy', '']};
  const tiles = [
    p ? tile('Krótki termin: plan analizatora', h('span', {class: 'badge ' + (act === 'long' ? 'v-plus' : act === 'short' ? 'v-minus' : 'v-zero')}, act === 'wait' ? 'CZEKAJ' : act === 'long' ? 'KUP' : 'SPRZEDAJ (short)'), 'świeca z ' + fmtDate(p.date)) : null,
    total && p ? tile('Bilans sygnałów', `▲ ${cnt['+']} · ● ${cnt['0']} · ▼ ${cnt['-']}`, `saldo ${sgn(net)} z ${total} reguł`) : null,
    REG[regime] ? tile('Trend długoterminowy', REG[regime][0], ok(rk.vs_sma200_pct) ? `cena ${pct(rk.vs_sma200_pct, 1)} względem SMA200` : null, null, REG[regime][1]) : null,
    tt && ok(tt.exposure_pct) ? tile('Plan „Trend SMA200”', tt.exposure_pct > 0 ? 'W rynku' : 'Poza rynkiem', (tt.exposure_pct > 0 ? 'od ' : 'od ') + dayTxt(tt.since_days) + ' (filtr trendu, nie sygnał na dziś)') : null,
    rk.level ? tile('Poziom ryzyka rynku', h('span', {class: 'badge ' + lvlCls}, rk.level), ok(rk.vol_pct) ? `zmienność ${fmt(rk.vol_pct, 0)}% rocznie` : null) : null,
  ].filter(Boolean);
  return card({id: 'sec-decyzja', title: 'Decyzja na dziś', sub: 'Wstrzymać się, long czy short · heurystyka na danych historycznych, nie porada inwestycyjna'},
    h('div', {class: 'plan ' + (act === 'wait' ? '' : act === 'long' ? 'buy' : 'sell')}, top, ticket, lists),
    tiles.length ? h('div', {class: 'tiles small dtiles'}, tiles) : null,
    h('div', {class: 'calcbar'},
      h('a', {class: 'btn pri', href: 'kalkulator.html'}, 'Zagraj w swoim przedziale czasu: kalkulator szans →'),
      p ? h('a', {class: 'btn', href: '#sec-plan'}, 'Pełny plan ↓') : null),
    h('p', {class: 'note', style: 'margin-top:8px'}, 'Ta decyzja dotyczy kilku najbliższych dni (reguły na świecach dziennych). Jeśli chcesz zagrać w innym przedziale czasu, kalkulator sprawdzi na historii, jakie zagrania miały tam sens i z jaką częstością kończyły się zyskiem.'));
}
function plannerCards(r) { return r.planner ? [planCard(r), journalCard(r), flowCard(r)] : [null, null, null]; }
function bybitCards(r) {
  const b = r.bybit;
  if (!b) return [null, null, null, null];
  return [bybitAccountCard(b), bybitPerfCard(b), bybitMarketCard(b), bybitPositionsCard(b)];
}

/* ---------- newsy ---------- */
function newsSection(r) {
  const n = r.analysis && r.analysis.news;
  if (!n) return null;
  const seen = new Set(), items = [];
  for (const sec of Object.values(n.sections || {})) for (const it of sec.items || []) {
    const key = (it.title || '').toLowerCase();
    if (!key || seen.has(key)) continue;
    seen.add(key); items.push(it);
  }
  items.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  if (!items.length) return null;
  const t = n.tally || {};
  const tot = (t.bull || 0) + (t.bear || 0) + (t.neutral || 0);
  const bal = tot ? h('div', {class: 'balance', role: 'img', 'aria-label': `${t.bull || 0} bycze, ${t.bear || 0} niedźwiedzie, ${t.neutral || 0} neutralne`, style: 'margin-top:0'},
    [['s-plus', t.bull], ['s-zero', t.neutral], ['s-minus', t.bear]].map(([c, v]) => v ? h('span', {class: c, style: '--f:' + v}) : null)) : null;
  return card({id: 'sec-newsy', title: 'Newsy o BTC', sub: 'Ostatnie nagłówki z oceną tonu'},
    bal,
    h('ul', {class: 'news', style: 'margin-top:14px'}, items.slice(0, 10).map((it, i) => {
      const [cls, mark, word] = SIG[it.verdict > 0 ? '+' : it.verdict < 0 ? '-' : '0'];
      const href = safeUrl(it.link);
      const col = it.verdict > 0 ? 'var(--bull)' : it.verdict < 0 ? 'var(--bear)' : 'var(--neutral)';
      return h('li', {style: `--i:${i};--c:${col}`}, h('i', {class: 'bar4'}),
        h('div', null,
          href ? h('a', {href, target: '_blank', rel: 'noopener noreferrer'}, it.title) : h('span', {style: 'font-weight:600'}, it.title),
          h('div', {class: 'meta'}, h('span', {class: 'badge ' + cls, style: 'padding:1px 9px;font-size:.76rem'}, mark + ' ' + word), [it.source, String(it.date || '').slice(0, 16)].filter(Boolean).join(' · '))));
    })),
    h('p', {class: 'note'}, `Nagłówki: ${t.bull || 0} bycze, ${t.bear || 0} niedźwiedzie, ${t.neutral || 0} neutralne (metoda: ${t.basis || 'n/d'}). ` +
      'Na planie darmowym newsy mają około 12 godzin opóźnienia, a ocena słów kluczowych jest przybliżona.' +
      (ok(n.credits_remaining) ? ' Pozostałe kredyty newsdata.io: ' + n.credits_remaining + '.' : '')));
}
function reportSection(r) {
  if (!r.report_text) return null;
  return card({id: 'sec-raport', title: 'Pełny raport tekstowy'}, h('details', null, h('summary', null, 'Pokaż raport'), h('pre', null, r.report_text)));
}
function footer(r) {
  const w = r.warnings || [];
  return h('footer', null,
    h('p', {style: 'margin:0'}, 'To analiza techniczna na danych historycznych (CoinGecko, newsdata.io' + (r.bybit || r.planner ? ', Bybit' : '') + '), a nie porada inwestycyjna.'),
    w.length ? h('p', {style: 'margin:10px 0 0'}, 'Pominięte lub niepełne źródła:') : null,
    w.length ? h('ul', null, w.map(x => h('li', null, x))) : null);
}

/* ---------- motyw ---------- */
const themeBtn = document.getElementById('theme');
const THEMES = [['auto', '◐', 'Auto'], ['light', '☀', 'Jasny'], ['dark', '☾', 'Ciemny']];
function curTheme() { const t = document.documentElement.getAttribute('data-theme'); return THEMES.some(x => x[0] === t) ? t : 'auto'; }
function paintTheme() {
  const [, ic, nm] = THEMES.find(x => x[0] === curTheme());
  themeBtn.replaceChildren(h('span', {'aria-hidden': 'true'}, ic), h('span', null, nm));
  themeBtn.setAttribute('aria-label', 'Motyw: ' + nm + '. Kliknij, aby zmienić.');
}
themeBtn.addEventListener('click', () => {
  const i = THEMES.findIndex(x => x[0] === curTheme()), nx = THEMES[(i + 1) % THEMES.length][0];
  document.documentElement.setAttribute('data-theme', nx);
  try { if (nx === 'auto') localStorage.removeItem('btc-theme'); else localStorage.setItem('btc-theme', nx); } catch (e) {}
  paintTheme();
});
paintTheme();

/* ---------- renderowanie i odświeżanie ---------- */
function setStatus(r) {
  const ageH = (Date.now() - new Date(r.generated_at).getTime()) / 3600000;
  statusEl.textContent = 'Dane z ' + new Date(r.generated_at).toLocaleString('pl-PL', {dateStyle: 'medium', timeStyle: 'short'}) + ', ' + ago(r.generated_at) + '.';
  liveEl.classList.toggle('stale', ageH > STALE_HOURS);
}
function watchHero(el) {
  if (heroIO) { heroIO.disconnect(); heroIO = null; }
  document.body.classList.remove('past-hero');
  if (!('IntersectionObserver' in window)) return;
  heroIO = new IntersectionObserver(([e]) => document.body.classList.toggle('past-hero', !e.isIntersecting && e.boundingClientRect.top < 0));
  heroIO.observe(el);
}
function render(r) {
  ANIM = firstPaint && !REDUCED;
  report = r;
  setStatus(r);
  const ageH = (Date.now() - new Date(r.generated_at).getTime()) / 3600000;
  const price = effPrice(r);
  const ch24 = (r.market || {}).price_change_percentage_24h_in_currency ?? (((r.spot || {})[r.vs || 'usd']) || {}).change_24h;
  miniEl.replaceChildren('₿ ' + fmt(price, price >= 1000 ? 0 : 2), ok(ch24) ? h('span', {class: sign(ch24)}, arrow(ch24) + ' ' + pct(ch24)) : null);

  chartBox = null; chartStats = null; chartNote = null;
  const list = [];
  const add = (id, label, el) => { if (el) list.push({id, label, el}); };
  if (ageH > STALE_HOURS) add(null, null, h('p', {class: 'banner'}, `Dane są nieaktualne (${Math.round(ageH)} godz.). Sprawdź, czy zadanie cron na serwerze nadal działa.`));
  const hero = heroSection(r);
  add(null, null, hero);
  add(null, null, kpiStrip(r));
  add('sec-decyzja', 'Decyzja', decisionCard(r));
  add('sec-wykres', 'Wykres', r.series && r.series.date && r.series.price ? chartSection(r) : null);
  const pc = plannerCards(r);
  add('sec-plan', 'Plan', pc[0]); add('sec-kalk', 'Kalkulator', calcCard(r)); add('sec-dziennik', 'Dziennik', pc[1]); add('sec-lab', 'Długi termin', labCard(r));
  add('sec-sygnaly', 'Sygnały', verdictSection(r));
  add('sec-techniczne', 'Wskaźniki', technicalSection(r));
  add('sec-fib', 'Fibonacci', fibSection(r));
  add('sec-korelacja', 'Korelacja', compareSection(r));
  const rs = returnsSections(r);
  add('sec-zwroty', 'Zwroty', rs[0]); add('sec-obsuniecie', null, rs[1]); add('sec-kalendarz', 'Kalendarz', rs[2]);
  add('sec-rynek', 'Rynek', marketSection(r));
  add('sec-struktura', null, structureSection(r));
  add('sec-pochodne', 'Pochodne', derivativesSection(r));
  add('sec-dodatkowe', 'Sygnały+', extrasSignalsCard(r)); add('sec-dodatkowe-pochodne', null, extrasDerivsCard(r)); add('sec-chain', 'On-chain', extrasChainCard(r)); add('sec-makro', 'Makro', extrasMacroCard(r));
  add('sec-gieldy', 'Giełdy', exchangesSection(r));
  const bb = bybitCards(r);
  add('sec-bybit', 'Bybit', bb[0]); add('sec-bybit-pozycje', 'Pozycje', bb[3]); add('sec-bybit-wyniki', null, bb[1]); add('sec-bybit-rynek', null, bb[2]); add('sec-ceny', 'Rozkład cen', pc[2]);
  add('sec-skarbce', 'Skarbce', treasurySection(r));
  add('sec-newsy', 'Newsy', newsSection(r));
  add('sec-raport', 'Raport', reportSection(r));

  /* lone .half -> full */
  let pend = [];
  for (const it of list) {
    if (it.el.classList.contains('half')) { pend.push(it.el); if (pend.length === 2) pend = []; }
    else { if (pend.length === 1) pend[0].classList.remove('half'); pend = []; }
  }
  if (pend.length === 1) pend[0].classList.remove('half');

  const nav = h('nav', {class: 'nav', 'aria-label': 'Sekcje strony'}, list.filter(x => x.id && x.label).map(x => h('a', {href: '#' + x.id}, x.label)), h('a', {href: 'kalkulator.html'}, 'Kalkulator zagrań ↗'));
  const stack = h('div', {class: 'stack'});
  let delay = 0;
  list.forEach((it, i) => {
    if (i === (list.findIndex(x => x.el === hero) + 1) || (i === 0 && list[0].el === hero)) { /* nav po hero i KPI */ }
    if (it.el.classList.contains('reveal') && delay < 4) { it.el.style.setProperty('--d', delay++); }
    stack.append(it.el);
    const isKpi = it.el.classList.contains('kpis');
    if (isKpi || (it.el === hero && !list.some(x => x.el.classList.contains('kpis')))) stack.append(nav);
  });
  stack.append(h('div', {style: 'grid-column:1/-1'}, footer(r)));
  app.replaceChildren(stack);
  observeReveals(app, !ANIM);
  watchHero(hero);
  drawChart(ANIM);
  prevPrice = ok(price) ? Number(price) : prevPrice;
  firstPaint = false;
}
async function load(manual) {
  const rb = document.getElementById('refresh');
  if (manual) { statusEl.textContent = 'Wczytuję…'; rb.classList.add('spin'); }
  try {
    const res = await fetch(REPORT_URL + '?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!report || data.generated_at !== report.generated_at) render(data);
    else setStatus(data);
  } catch (err) {
    if (report) { statusEl.textContent = 'Nie udało się odświeżyć. Pokazuję ostatnie dane.'; return; }
    statusEl.textContent = 'Brak danych.';
    app.replaceChildren(h('p', {class: 'failure'}, h('strong', null, 'Nie mogę wczytać pliku ' + REPORT_URL + '. '),
      'Uruchom na serwerze: python btc_analysis.py --quiet --web-json ' + REPORT_URL + ', a potem ustaw to polecenie w zadaniu cron. Szczegóły błędu: ' + err.message));
  } finally {
    if (manual) setTimeout(() => rb.classList.remove('spin'), 500);
  }
}
document.getElementById('refresh').addEventListener('click', () => load(true));

/* ---------- cena na żywo: publiczny WebSocket Bybit (bez klucza, za darmo) ---------- */
(() => {
  const WS_URL = 'wss://stream.bybit.com/v5/public/spot', TOPIC = 'tickers.BTCUSDT';
  const REST_URL = 'https://api.bybit.com/v5/market/tickers?category=spot&symbol=BTCUSDT';
  let ws = null, retry = 0, pingT = 0, restT = 0, lastPaint = 0;
  function paint() {
    if (!report || livePrice == null || (report.vs || 'usd') !== 'usd') return;
    const now = performance.now();
    if (now - lastPaint < 700) return;           // max ok. 1 odświeżenie na sekundę
    lastPaint = now;
    const p = livePrice, d = p >= 1000 ? 0 : 2;
    if (heroNum && heroNum.isConnected) {
      const prev = Number(heroNum.dataset.v || prevPrice);
      heroNum.textContent = fmt(p, d); heroNum.dataset.v = p;
      if (heroNow && ok(prev) && prev !== p && !REDUCED) {
        heroNow.classList.remove('flash-up', 'flash-down'); void heroNow.offsetWidth;
        heroNow.classList.add(p > prev ? 'flash-up' : 'flash-down');
      }
    }
    const ch24 = (report.market || {}).price_change_percentage_24h_in_currency;
    miniEl.replaceChildren('₿ ' + fmt(p, d), ok(ch24) ? h('span', {class: sign(ch24)}, arrow(ch24) + ' ' + pct(ch24)) : null);
    prevPrice = p;
    liveEl.title = 'Cena BTC na żywo (Bybit, ' + new Date(liveTs).toLocaleTimeString('pl-PL') + ')';
  }
  function onPrice(p) {
    p = Number(p);
    if (!(p > 0)) return;
    livePrice = p; liveTs = Date.now(); paint();
  }
  function startRest() {                           // zapas, gdy WebSocket jest zablokowany
    if (restT) return;
    const tick = async () => {
      if (document.hidden) return;
      try {
        const j = await (await fetch(REST_URL, {cache: 'no-store'})).json();
        onPrice(j.result.list[0].lastPrice);
      } catch (e) {}
    };
    tick(); restT = setInterval(tick, 5000);
  }
  function stopRest() { clearInterval(restT); restT = 0; }
  function connect() {
    if (document.hidden || ws) return;
    try { ws = new WebSocket(WS_URL); } catch (e) { startRest(); return; }
    ws.onopen = () => {
      retry = 0; stopRest();
      ws.send(JSON.stringify({op: 'subscribe', args: [TOPIC]}));
      pingT = setInterval(() => { try { ws.send('{"op":"ping"}'); } catch (e) {} }, 20000);
    };
    ws.onmessage = ev => {
      try { const m = JSON.parse(ev.data); if (m.topic === TOPIC && m.data && m.data.lastPrice) onPrice(m.data.lastPrice); } catch (e) {}
    };
    ws.onclose = () => {
      clearInterval(pingT); ws = null;
      if (retry++ > 2) startRest();
      if (!document.hidden) setTimeout(connect, Math.min(30000, 1000 * 2 ** retry));
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (ws) { ws.onclose = null; clearInterval(pingT); ws.close(); ws = null; } stopRest(); }
    else { retry = 0; connect(); }
  });
  connect();
})();
let rafId = 0;
new ResizeObserver(() => {
  if (!chartBox || Math.abs(chartBox.clientWidth - lastWidth) < 2) return;
  cancelAnimationFrame(rafId); rafId = requestAnimationFrame(() => drawChart(false));
}).observe(document.body);
setInterval(() => load(false), REFRESH_MS);
setInterval(() => { if (report) setStatus(report); }, 60000);
load(false);
})();
