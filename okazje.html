<style>

*{box-sizing:border-box}

.wrap{max-width:1250px;margin:0 auto;padding:18px 16px 60px}

a{color:var(--accent)} .sub{color:var(--muted);font-size:.84rem;margin:0 0 10px}

.up{color:var(--bull)} .down{color:var(--bear)} .mut{color:var(--muted)}

</style>

<body>
<div class="wrap">
<header>
  <div><h1>Okazje zakupowe</h1><p class="sub" style="margin:0"><span class="pulse" id="pulse"></span><span id="meta">Wczytuję…</span></p></div>
  <div><a class="btn" href="index.html">← Panel</a> <a class="btn" href="rynki.html">Rynki</a> <a class="btn" href="bot.html">Bot</a> <a class="btn" href="sytuacje.html">Sytuacje</a> <a class="btn" href="strategie.html" target="strategie" onclick="window.open(this.href,'strategie','width=1320,height=920');return false">Strategie</a></div>
</header>
<div class="warn"><b>Analiza statystyczna, nie porada inwestycyjna.</b> System nie składa zleceń. Notowania akcji są opóźnione (ok. 15 min), krypto i waluty bliżej czasu rzeczywistego. Prawdopodobieństwa pochodzą z historii i mogą się nie sprawdzić.</div>
<div class="flow" id="flow" aria-live="off"></div>
<div class="card">
  <div class="bar"><div class="seg" id="seg" role="group" aria-label="Klasa aktywów"></div><input id="q" type="search" placeholder="Szukaj…" aria-label="Szukaj aktywa"><label class="mut" style="font-size:.8rem"><input type="checkbox" id="onlyDip"> tylko dołki</label></div>
  <div class="tbl-w"><table id="tbl"><tbody><tr><td><div class="ui-skel" style="height:230px"></div></td></tr></tbody></table></div>
  <p class="note" id="evs"></p>
</div>
<div id="report"></div>
<div class="two"><div class="card" id="positions"></div><div class="card" id="perf"></div></div>
</div>
<script>
(() => {

      el('td', {class: 'r ' + cls(x.dd60)}, pc(x.dd60)), el('td', {class: 'r'}, x.rsi == null ? 'n/d' : nf(x.rsi, 0)),
      el('td', {class: 'r'}, el('span', {class: 'sc'}, el('i', {style: `width:${Math.min(100, x.score)}%`})), nf(x.score, 0)), el('td', {class: 'r'}, el('span', {class: 'chip ' + st[1]}, UI.icon(STATUS_ICON[x.status] || 'bars'), ' ', st[0])),
      el('td', {class: 'r'}, p && x.in_dip ? `${px(p.entry_lo)} – ${px(p.entry_hi)}` : '–'), el('td', {class: 'r down'}, p && x.in_dip ? px(p.stop) : '–'), el('td', {class: 'r up'}, p && x.in_dip ? px(p.tp1) : '–'),
      el('td', {class: 'r'}, x.p_tp1 != null && x.in_dip ? nf(x.p_tp1 * 100, 0) + '%' : '–'), el('td', {class: 'r'}, t && x.in_dip ? `~${t.median} (${t.p25}–${t.p75}) sesji` : '–'));

    return tr;
  });
  document.getElementById('tbl').replaceChildren(thead, el('tbody', null, body.length ? body : el('tr', null, el('td', {colspan: heads.length, class: 'mut'}, UI.icon('search'), ' Brak aktywów spełniających filtr.'))));
}
function notifyNew(list) {
  for (const x of list) {
    const was = prevStatus[x.key];
    if (!firstScan && was && was !== x.status) {
      if (x.status === 'okazja') UI.toast(`${x.name}: nowa okazja (wynik ${Math.round(x.score)}). Strefa wejścia ${px(x.plan.entry_lo)}–${px(x.plan.entry_hi)}, stop ${px(x.plan.stop)}.`, {title: 'Nowa okazja', kind: 'good', icon: 'target'});
      else if (x.status === 'spadający nóż') UI.toast(`${x.name}: wzorzec spadającego noża, nie kupuj.`, {title: 'Ostrzeżenie', kind: 'bad', icon: 'alert'});
    }

  }

}
async function loadScan() {
  try {
    const j = await api('scan');
    notifyNew(j.items);
    items = j.items; lastOk = Date.now();
    const c = j.counts || {};
    document.getElementById('meta').textContent = `${items.length} aktywów · okazji: ${c['okazja'] || 0}, do obserwacji: ${c['obserwuj'] || 0} · notowania sprzed ${j.live_age_s == null ? '?' : Math.round(j.live_age_s)} s · odświeżanie co 10 s`;
    document.getElementById('pulse').className = 'pulse' + (j.live_age_s != null && j.live_age_s > 120 ? ' stale' : '');
    document.getElementById('evs').textContent = (j.events || []).length ? 'Zdarzenia w ciągu 5 dni: ' + j.events.map(e => `${e.label} (${e.days === 0 ? 'dziś' : 'za ' + e.days + ' dni'})`).join(', ') + '. Rynki bywają wtedy gwałtowne.' : '';

  } catch (e) { document.getElementById('meta').textContent = 'Brak połączenia z API: ' + e.message; document.getElementById('pulse').className = 'pulse stale'; }

const seg = document.getElementById('seg');
[['', 'Wszystko'], ['crypto', 'Krypto'], ['commodity', 'Surowce'], ['fx', 'Waluty'], ['stock', 'Akcje']].forEach(([k, l]) => { const b = el('button', {type: 'button', 'aria-pressed': String(k === filter)}, l); b.addEventListener('click', () => { filter = k; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderTable(); }); seg.append(b); });

/* ---------- raport ---------- */
const box = document.getElementById('report');
const card = (title, sub, ...k) => el('section', {class: 'card'}, el('h2', null, title), sub ? el('p', {class: 'sub'}, sub) : null, ...k);
const lv = (cls_, label, v, sub) => el('div', {class: cls_}, el('span', null, label), el('b', null, v), sub ? el('span', null, sub) : null);

}
function renderReport(r, cap, risk) {

    el('div', {style: 'display:flex;gap:18px;align-items:center;flex-wrap:wrap'}, UI.gauge(r.score, {size: 150, label: 'wynik', good: v.threshold}), el('div', null, el('span', {class: 'chip ' + st[1]}, UI.icon(STATUS_ICON[r.status] || 'bars'), ' ', st[0]), r.p_tp1 != null && r.in_dip ? el('div', {style: 'margin-top:8px;min-width:220px'}, el('span', {class: 'sub'}, 'Szansa celu 1 przed stopem: ' + nf(r.p_tp1 * 100, 0) + '%'), UI.bar(r.p_tp1, r.p_tp1 >= 0.4 ? 'up' : 'down')) : null)), inputs));

    out.push(card('Ile czekać i z jakim prawdopodobieństwem', `Źródło statystyk: ${pr.source}${m ? `, ${m.n} podobnych dołków w historii` : ''}.`,
      el('div', {class: 'kv'}, ...[[cal != null ? nf(cal * 100, 0) + '%' : 'n/d', 'szansa celu 1 przed stopem (po korekcie)'], [m ? nf(m.p_stop * 100, 0) + '%' : 'n/d', 'szansa stopu przed celem'], [m ? nf(m.p_timeout * 100, 0) + '%' : 'n/d', `bez rozstrzygnięcia w ${tm.horizon_sessions} sesjach`],

      el('p', {class: 'note'}, 'Szansa, że minimum ceny dotknie dolnej granicy strefy (z historii tego aktywa). Jeśli zlecenie limit nie wejdzie w kilka sesji, układ zwykle się zmienia: przelicz raport.')));

      el('div', null, el('b', null, nf(z.qty, z.qty < 1 ? 5 : 3)), el('span', null, 'ilość')), el('div', null, el('b', null, nf(z.position_value, 2)), el('span', null, `wartość pozycji (${nf(z.pct_of_capital, 0)}% kapitału)`)),

      (() => { const b = el('button', {class: 'btn', type: 'button'}, 'Śledź tę pozycję (wpisz cenę wejścia w sekcji obok)'); b.addEventListener('click', () => { document.getElementById('f_sym').value = r.key; document.getElementById('f_entry').value = px(p.entry_hi).replace(/\s/g, '').replace(',', '.'); document.getElementById('f_stop').value = String(p.stop); document.getElementById('f_entry').focus(); }); return b; })())); }
  }
  out.push(card('Dlaczego', 'Co wskazuje na dołek i dlaczego (lub dlaczego nie).', el('ul', {class: 'rs'}, r.reasons.map(t => el('li', null, t))), r.risks.length ? el('h3', null, 'Ryzyka') : null, r.risks.length ? el('ul', {class: 'rs'}, r.risks.map(t => el('li', {class: 'down'}, t))) : null));
  if (r.scenarios) out.push(card('Scenariusze', null, el('ul', {class: 'rs'}, r.scenarios.map(s => el('li', null, el('b', null, s.name + ': '), s.text)))));
  const c = r.context;
  out.push(card('Kontekst', null, el('div', {class: 'kv'}, ...[['SMA20', c.indicators.sma20], ['SMA50', c.indicators.sma50], ['SMA200', c.indicators.sma200]].map(([l, v2]) => el('div', null, el('b', null, px(v2)), el('span', null, l))),
    el('div', null, el('b', null, c.indicators.atr_pct == null ? 'n/d' : nf(c.indicators.atr_pct, 2) + '%'), el('span', null, 'ATR (dzienna zmienność)')), ...c.macro.map(m => el('div', null, el('b', null, nf(m.value, 1)), el('span', null, `${m.label} (20 dni: ${pc(m.chg_20d)})`)))),
    c.levels.supports.length ? el('p', {class: 'note'}, 'Wsparcia: ' + c.levels.supports.map(px).join(' · ') + (c.levels.resistances.length ? '  |  Opory: ' + c.levels.resistances.map(px).join(' · ') : '')) : null,
    c.events.length ? el('p', {class: 'note'}, 'Najbliższe zdarzenia: ' + c.events.map(e => `${e.label} ${e.date}`).join(', ')) : null));
  out.push(card('Korekty systemu wynikające z reakcji rynku', 'System uczy się na wynikach poprzednich okazji (osobno dla klasy aktywów).', el('ul', {class: 'rs'}, r.adjustments.map(t => el('li', null, t))), el('p', {class: 'note'}, r.disclaimer)));
  box.replaceChildren(...out);
}

/* ---------- pozycje i skuteczność ---------- */
async function loadPositions() {
  const host = document.getElementById('positions');
  try {
    const j = await api('positions');
    const list = j.positions.map(p => { const bad = p.status === 'STOP' || p.status === 'pod presją', good = p.status.startsWith('CEL');
      const del = el('button', {class: 'btn', type: 'button'}, 'Zakończ śledzenie'); del.addEventListener('click', async () => { await post('untrack', {id: p.id}); loadPositions(); });
      return el('div', {class: 'pos ' + (p.status === 'STOP' ? 'STOP' : bad ? 'pod' : good ? 'CEL' : '')}, el('b', null, `${p.name} (${p.key}) · ${p.status}`), el('div', null, `Wejście ${px(p.entry)}, cena ${px(p.price)} (${pc(p.pnl_pct / 100)}), ${nf(p.r_now, 2)}R, ${p.days} sesji` + (p.pnl_amount != null ? `, wynik ${nf(p.pnl_amount, 2)}` : '')),
        el('div', {class: 'mut'}, `Stop ${px(p.stop)} · cel 1 ${px(p.tp1)} · cel 2 ${px(p.tp2)}` + (p.suggested_stop ? ` · proponowany stop: ${px(p.suggested_stop)}` : '')), el('ul', {class: 'rs'}, p.actions.map(a => el('li', null, a))), del); });
    const f = el('form', {class: 'bar'}, el('input', {id: 'f_sym', placeholder: 'Symbol np. XAUUSD', list: 'symlist', required: true}), el('input', {id: 'f_entry', placeholder: 'Cena wejścia', inputmode: 'decimal', required: true}), el('input', {id: 'f_stop', placeholder: 'Stop', inputmode: 'decimal', required: true}), el('input', {id: 'f_qty', placeholder: 'Ilość (opc.)', inputmode: 'decimal'}), el('button', {class: 'btn', type: 'submit'}, 'Śledź'));
    f.addEventListener('submit', async e => { e.preventDefault(); const n = id => parseFloat(document.getElementById(id).value.replace(',', '.'));
      try { await post('track', {symbol: document.getElementById('f_sym').value.trim().toUpperCase(), entry: n('f_entry'), stop: n('f_stop'), qty: document.getElementById('f_qty').value ? n('f_qty') : null}); loadPositions(); } catch (err) { alert(err.message); } });
    const dl = el('datalist', {id: 'symlist'}, items.map(x => el('option', {value: x.key}, x.name)));
    host.replaceChildren(el('h2', null, 'Twoje pozycje'), el('p', {class: 'sub'}, 'Wpisz pozycję, którą otworzyłeś: system na bieżąco ocenia reakcję rynku i podpowiada, co zrobić ze stopem i wyjściem. Nic nie jest wysyłane na giełdę.'), f, dl, ...(list.length ? list : [el('p', {class: 'note'}, 'Brak śledzonych pozycji.')]));
  } catch (e) { host.replaceChildren(el('h2', null, 'Twoje pozycje'), el('p', {class: 'note'}, 'Błąd: ' + e.message)); }
}
async function loadPerf() {

    const j = await api('performance');

      return el('div', {class: 'tbl-w'}, el('h3', null, title + (d._open ? ` (otwartych: ${d._open})` : '')), el('table', {style: 'min-width:420px'}, el('thead', null, el('tr', null, ['Klasa', 'Okazji', 'Trafiony cel 1', 'Model zakładał', 'Śr. R', 'Nie weszło'].map((h, i) => el('th', {class: i ? 'r' : ''}, h)))),
        el('tbody', null, keys.map(k => { const v = d[k]; return el('tr', null, el('td', null, k), el('td', {class: 'r'}, v.n), el('td', {class: 'r'}, v.win_rate == null ? 'n/d' : nf(v.win_rate * 100, 0) + '%'), el('td', {class: 'r'}, v.avg_p_model == null ? 'n/d' : nf(v.avg_p_model * 100, 0) + '%'), el('td', {class: 'r ' + cls(v.avg_r)}, v.avg_r == null ? 'n/d' : nf(v.avg_r, 2)), el('td', {class: 'r'}, v.missed)); })))); };
    const pr = j.params || {}, notes = pr.notes || [];
    host.replaceChildren(el('h2', null, 'Skuteczność systemu'), el('p', {class: 'sub'}, 'Porównanie tego, co model zakładał, z tym, co zrobił rynek. Różnice napędzają korekty.'), tbl(j.live || {}, 'Okazje rzeczywiste (od uruchomienia)'), tbl(j.replay || {}, 'Symulacja na historii (walk-forward)'),
      el('h3', null, 'Bieżące korekty'), el('ul', {class: 'rs'}, (notes.length ? notes : ['Brak korekt: za mało rozstrzygniętych okazji (potrzeba min. 8 na klasę).']).map(n => el('li', null, n))),
      el('p', {class: 'note'}, 'Poszerzenie stopów: ' + Object.entries(pr.stop_mult || {}).map(([k, v]) => `${k} ×${v}`).join(', ') + '. Progi wyniku: ' + Object.entries(pr.min_score || {}).map(([k, v]) => `${k} ${v}`).join(', ') + '.'));
  } catch (e) { host.replaceChildren(el('h2', null, 'Skuteczność systemu'), el('p', {class: 'note'}, 'Błąd: ' + e.message)); }
}
const mln = v => v == null ? 'n/d' : (v < 0 ? '−' : v > 0 ? '+' : '') + nf(Math.abs(v) / 1e6, 2) + ' mln';
let prevFlow = {};

  const box = document.getElementById('flow');

    const j = await api('stream');
    if (!j.flow) { box.replaceChildren(el('div', null, el('b', {class: 'mut'}, 'brak strumienia'), el('span', null, 'uruchom btc-stream (WebSocket)'))); return; }
    const f = j.flow.btc, m = j.mark || {}, b = j.block || {}, ps = j.providers || {};

    box.replaceChildren(

      tile('fund', 'funding / OI (Bybit)', `${m.funding_pct == null ? 'n/d' : nf(m.funding_pct, 4) + '%'} / ${m.oi_usd ? nf(m.oi_usd / 1e9, 2) + ' mld' : 'n/d'}`),
      tile('blk', 'ostatni blok BTC', b.height ? `${nf(b.height, 0)} · ${b.seen ? Math.max(0, Math.round((Date.now() / 1000 - b.seen) / 60)) + ' min temu' : ''}` : 'n/d', '', j.fees ? `Opłata (30 min): ${j.fees.halfHourFee} sat/vB` : ''),
      el('div', null, el('div', {class: 'src'}, ...Object.entries(ps).map(([k, v]) => el('span', {title: v.error || ''}, el('i', {class: v.connected && v.age != null && v.age < 30 ? 'on' : ''}), k))), el('span', null, `strumień sprzed ${j.age_s == null ? '?' : Math.round(j.age_s)} s`)));
  } catch (e) { box.replaceChildren(el('div', null, el('b', {class: 'mut'}, 'strumień niedostępny'), el('span', null, e.message))); }
