<script>
(() => {

const lg = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const ls = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* tryb prywatny */ } };
const api = async (path, opt) => { const r = await fetch('api/' + path, Object.assign({cache: 'no-store'}, opt)); let j = null; try { j = await r.json(); } catch (e) { /* brak JSON */ } if (!r.ok) throw new Error((j && j.error) || 'HTTP ' + r.status); return j; };
const post = (path, body) => api(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Requested-With': 'btc-ui'}, body: JSON.stringify(body)});
const soft = async path => { try { return await api(path); } catch (e) { return null; } };
let uid = 0; const newId = () => Date.now() * 10 + (uid++ % 10);

document.addEventListener('input', ev => { const t = ev.target; if (t && t.dataset && t.dataset.k) t.dataset.d = '1'; });
// Przerysowanie listy nie kasuje wpisywanych wartości (pola data-k ruszone przez użytkownika) ani fokusu; nietknięte pola biorą świeże dane.

  box.replaceChildren(...kids);
  box.querySelectorAll('[data-k]').forEach(e => { if (e.dataset.k in old) { e.value = old[e.dataset.k]; e.dataset.d = '1'; } });
  if (fk) { const n = box.querySelector(`[data-k="${fk}"]`); if (n) { n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { /* pole liczby lub daty */ } } }
}

// ----------------------------------------------------------------- stan, zapis i scalanie zmian
const S = {list: [], zar: {entries: [], goal: null}, tasks: [], profile: {}, today: null, ai: null, prompts: {}, offline: false, busy: false, form: null, showHist: false, found: null};
const KEYS = {
  produkty_lista: ['list', v => v || []],
  zarobki: ['zar', v => (v && Array.isArray(v.entries) ? v : {entries: [], goal: null})],
  alfred_tasks: ['tasks', v => v || []],
  mentor_profile: ['profile', v => v || {}],
};
const goalOf = (b, l, r) => (b ? (l.goal !== b.goal ? l.goal : r.goal) : (l.goal != null ? l.goal : r.goal));
const MERGE = {
  produkty_lista: (b, l, r) => UD.merge(b, l, r, 't'),
  alfred_tasks: (b, l, r) => UD.merge(b, l, r, 't'),
  zarobki: (b, l, r) => ({entries: UD.merge(b && b.entries, l.entries, r.entries, 't'), goal: goalOf(b, l, r)}),
};
const GET = {zarobki: () => ({entries: S.zar.entries.slice(-2000), goal: S.zar.goal}), produkty_lista: () => S.list, alfred_tasks: () => S.tasks, mentor_profile: () => S.profile};
let rt = null; const refreshSoon = () => { clearTimeout(rt); rt = setTimeout(loadToday, 250); };
let retryT = null; const retrySoon = () => { clearTimeout(retryT); retryT = setTimeout(loadToday, 20000); };
async function persist(key) {
  const [field, parse] = KEYS[key];
  const r = await UD.sync(key, {get: GET[key], merge: MERGE[key], apply: v => { S[field] = parse(v); renderAll(); }});
  if (r.offline) { S.offline = true; renderBanner(); renderDeals(); retrySoon(); }
  else if (!r.ok && r.conflict) Calm.toast('Dane zmieniono na innym urządzeniu: wczytano najnowszą wersję.');
  else if (!r.ok) Calm.toast('Błąd zapisu: ' + (r.error || ''));

const syncAll = () => Object.keys(KEYS).forEach(persist);
const settle = () => Promise.all(Object.keys(KEYS).map(k => UD._q[k]));

// ----------------------------------------------------------------- liczenie opłacalności (jedno miejsce dla kreatora i poleceń głosowych)
function calcDeal(p) {
  const buy = +p.buy || 0, sell = +p.sell || 0, fee = +p.fee || 0, costs = (+p.ship || 0) + (+p.oth || 0) + (+p.costs || 0), hrs = +p.hrs || 0;
  const cost = buy + costs, profit = sell * (1 - fee / 100) - cost, roi = cost > 0 ? profit / cost * 100 : 0, hr = hrs > 0 ? profit / hrs : null;
  const level = profit <= 0 ? 'bad' : (roi >= 30 && profit >= 30 && (hr == null || hr >= 20)) ? 'good' : 'mid';
  const text = {bad: 'Nie kupuj: przy tych liczbach tracisz.', good: 'Opłaca się, o ile sprzedasz po tej cenie i w rozsądnym czasie. Sprawdź stan przedmiotu i to, jak długo podobne wiszą niesprzedane.', mid: 'Zysk jest mały wobec czasu lub kapitału. Spróbuj wynegocjować niższą cenę zakupu.'}[level];
  const title = {bad: 'Nie kupuj', good: 'Opłaca się', mid: 'Ryzykowne'}[level];
  return {buy, sell, fee, costs, cost, profit, roi, hr, level, text, title, ok: buy > 0 && sell > 0};
}
function addDeal(p) {
  const c = calcDeal(p), round = (v, n) => v == null ? null : Math.round(v * n) / n, has = p.buy != null && p.sell != null && c.ok;
  const d = {t: newId(), name: String(p.name || 'bez nazwy').slice(0, 100), status: 'kandydat', url: okUrl(p.url) ? p.url.slice(0, 300) : '', buy: p.buy == null ? null : +p.buy, sell: p.sell == null ? null : +p.sell,
    profit: has ? round(c.profit, 100) : null, roi: has && c.cost > 0 ? round(c.roi, 10) : null, hr: has && c.hr != null ? round(c.hr, 100) : null, costs: c.costs, fee: c.fee,
    bought_price: null, list_price: null, sold_price: null, fee_paid: null, d_bought: '', d_listed: '', d_sold: '', note: ''};
  S.list.push(d); persist('produkty_lista'); renderAll(); return d;
}

// ----------------------------------------------------------------- asystent (doradca)
const HELP = 'Dotknij mojej postaci i mów albo pisz. Na przykład:\n• „dodaj ofertę rower górski za 300 sprzedam za 450”\n• „kupiłem rower za 300”, „wystawiłem rower za 450”, „sprzedałem rower za 440”\n• „co dalej”, „ile zarobiłem”\n• „dodaj zadanie wystawić rower jutro”\nPytania o pomysły na zarobek zadaj zwykłym zdaniem.';
let alf, autoBubble = true, lastKey = '', lastTouch = Date.now();
const touch = () => { lastTouch = Date.now(); };
const STLAB = {kandydat: 'Kandydat', kupione: 'Do wystawienia', wystawione: 'Wystawione', sprzedane: 'Sprzedane', odrzucone: 'Odrzucone'};

function chips() { return [{label: 'Pomysły dla mnie', run: () => askMentor('Zaproponuj 3 pomysły dla mnie', 'Na podstawie mojego profilu i tego, co już robię, zaproponuj 3 konkretne, legalne pomysły na dodatkowy dochód w mojej okolicy, od najmniej ryzykownego. Jeśli czegoś brakuje w profilu, najpierw zadaj pytania.')},
  {label: 'Co jest na topie?', run: () => askMentor('Co jest teraz na topie?', 'Znajdź w internecie aktualne pomysły na dochód, które pasują do mojego profilu i regionu, także trendy z TikToka. Podaj 3 najlepsze: dla każdego dlaczego teraz, kapitał, jak sprawdzić popyt lokalnie przed wydaniem pieniędzy i największe ryzyko.', true)},
  {label: 'Mój profil', run: () => openProfile()}]; }

function nextBubble() {

  if (att.length) { const a = att[0], acts = [{label: 'Otwórz', primary: true, onclick: () => goDeal(a.t)}]; return {key: 'att' + a.t + a.days, text: `Uwaga: ${a.text}.`, actions: acts}; }
  const c = T.deals.stats.counts, prog = c.kupione + c.wystawione;
  if (prog) return {key: 'prog' + prog + c.kandydat, text: `Masz ${prog} ${plural(prog, 'ofertę', 'oferty', 'ofert')} w toku` + (c.kandydat ? ` i ${c.kandydat} ${plural(c.kandydat, 'kandydata', 'kandydatów', 'kandydatów')}` : '') + '. Wszystko idzie zgodnie z planem.', actions: []};
  if (c.kandydat) return {key: 'cand' + c.kandydat, text: `Masz ${c.kandydat} ${plural(c.kandydat, 'kandydata', 'kandydatów', 'kandydatów')} do zakupu. Kiedy coś kupisz, daj znać: „kupiłem rower za 300”.`, actions: []};

}
function showNext(force) {
  if (!alf || (!autoBubble && !force)) return;
  const b = nextBubble(); if (!force && b.key === lastKey) return; lastKey = b.key; autoBubble = true;
  alf.say(b.text, {actions: b.actions, keep: true, speak: false}); alf.setChips(chips());
}
function dealByName(name, statuses) {
  const pool = S.list.filter(x => statuses.includes(x.status));
  if (!name) return pool.length === 1 ? {deal: pool[0]} : {many: pool};
  const m = Intent.match(name, pool, x => x.name); if (m.length === 1) return {deal: m[0]}; if (m.length > 1) return {many: m};
  return {none: true};
}
const VERB = {deal_bought: ['bought', ['kandydat'], 'kupić', 'Kupione'], deal_listed: ['listed', ['kupione'], 'wystawić', 'Wystawione'], deal_sold: ['sold', ['wystawione', 'kupione'], 'sprzedać', 'Sprzedane'], deal_reject: ['reject', ['kandydat'], 'odrzucić', 'Odrzucone']};
async function onCommand(cmd) {
  autoBubble = false; touch();

    case 'add_deal': {
      const c = calcDeal({buy: cmd.buy, sell: cmd.sell}), d = addDeal({name: cmd.name, buy: cmd.buy, sell: cmd.sell}), ok = cmd.buy != null && cmd.sell != null;
      return {text: `Dodane do kandydatów: ${d.name}.` + (ok ? ` Zysk po kosztach ${zl(c.profit)}, zwrot ${nf(c.roi)}%. ${c.title}.` : ' Podaj ceny, a policzę opłacalność.'), mood: ok && c.level === 'good' ? 'happy' : undefined};
    }
    case 'deal_bought': case 'deal_listed': case 'deal_sold': case 'deal_reject': {
      const [action, from, verb, lab] = VERB[cmd.type], r = dealByName(cmd.name, from);
      if (r.deal) { const ok = await dealOp(r.deal.t, action, cmd.price != null && cmd.type !== 'deal_reject' ? {price: cmd.price} : {}, true); return ok ? {text: ok, mood: action === 'sold' ? 'happy' : undefined} : null; }
      if (r.many) return {text: r.many.length ? `Którą ofertę chcesz ${verb}? ` + r.many.slice(0, 5).map(x => x.name).join('; ') + '.' : `Nie mam oferty do ${verb === 'kupić' ? 'kupienia' : verb === 'wystawić' ? 'wystawienia' : verb === 'sprzedać' ? 'sprzedania' : 'odrzucenia'}.`};
      return {text: `Nie znalazłem takiej oferty${cmd.name ? ` („${cmd.name}”)` : ''}.`};
    }
    case 'money': case 'next': {
      const T = S.today; if (!T) return {text: 'Nie znam jeszcze wyników: brak połączenia z serwerem.'};
      if (cmd.type === 'next') { const b = nextBubble(); return {text: b.text, actions: b.actions}; }
      const m = T.money, st = T.deals.stats, c = st.counts, prog = c.kupione + c.wystawione;
      return {text: `W tym miesiącu zysk ${zl(m.profit_month == null ? 0 : m.profit_month)}` + (m.goal ? `, cel ${zl(m.goal)}` : '') + `. Ofert w toku: ${prog}` + (st.invested ? `, zamrożone ${zl(st.invested)}` : '') + (st.expected_profit ? `, oczekiwany zysk ${zl(st.expected_profit)}` : '') + '.', actions: [{label: 'Pokaż wyniki', onclick: openResults}]};
    }
    case 'add_task': {
      const td = ymd(new Date()), t = {t: newId(), text: cmd.text, date: cmd.date || td, done: false, top: false, done_ts: null, min: cmd.min || 30, ref: ''};
      S.tasks.push(t); persist('alfred_tasks'); return {text: `Dodane do planu dnia: ${t.text}, ${t.min} min. Zobaczysz je w zakładce Alfred.`, mood: 'happy'};
    }
    case 'review': case 'briefing': case 'plan': case 'start': case 'stopfocus': case 'later': case 'done': case 'add_habit':
      return {text: 'To zrobimy na stronie głównej Alfreda: plan dnia, zadania i nawyki.', actions: [{label: 'Otwórz Alfreda', primary: true, onclick: () => { location.href = 'alfred.html'; }}]};
    default: return undefined;
  }
}

// ----------------------------------------------------------------- górny pasek: kafelki i uwagi
function renderKpis() {
  const T = S.today, box = $('kpis');
  if (!T) { box.hidden = true; return; }
  const m = T.money, st = T.deals.stats, c = st.counts, prog = c.kupione + c.wystawione, p = m.profit_month == null ? 0 : m.profit_month;
  if (m.profit_month == null && !m.goal && Object.values(c).every(n => n === 0)) { box.hidden = true; return; }
  box.hidden = false;
  const k = (label, node, cls, onclick) => el(onclick ? 'button' : 'div', {class: 'kpi' + (onclick ? ' btn-like' : ''), type: onclick ? 'button' : null, onclick}, el('b', {class: cls || ''}, node), el('span', null, label));
  const b1 = el('span'); Calm.countUp(b1, p, {fmt: zl}); const b2 = el('span'); Calm.countUp(b2, st.expected_profit, {fmt: zl});
  box.replaceChildren(k('zysk w tym miesiącu' + (m.goal ? ` · cel ${zl(m.goal)}` : '') + ' · tap: wyniki', b1, p > 0 ? 'c-up' : p < 0 ? 'c-down' : '', openResults), k(`ofert w toku · zamrożone ${zl(st.invested)}`, document.createTextNode(String(prog))), k('oczekiwany zysk z ofert w toku', b2, st.expected_profit > 0 ? 'c-up' : ''));
}

  const box = $('attn'), xs = ((S.today && S.today.deals.attention) || []).slice(0, 3);
  box.replaceChildren(...xs.map(a => el('div', {class: 'a-item', style: 'background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:8px;box-shadow:var(--shadow)'}, el('span', {class: 'a-ico'}, '!'), el('span', {style: 'flex:1'}, a.text), el('button', {class: 'alf-btn', type: 'button', style: 'min-height:36px;padding:6px 16px', onclick: () => goDeal(a.t)}, 'Otwórz'))));
}
function goDeal(t) { S.showHist = S.showHist || (S.list.find(x => x.t === t) || {}).status === 'sprzedane'; renderDeals(); const e = $('deal-' + t); if (e) { e.scrollIntoView({behavior: 'smooth', block: 'center'}); e.classList.add('flash'); setTimeout(() => e.classList.remove('flash'), 2000); } }
function renderBanner() { $('banner').replaceChildren(...(S.offline ? [el('div', {class: 'c-banner'}, 'Serwer niedostępny: widzisz kopię z tej przeglądarki. Zmiany statusów ofert wymagają połączenia, wpisy i profil zapiszą się same, gdy serwer wróci.')] : [])); }

// ----------------------------------------------------------------- oferty: lista z jednym głównym przyciskiem
const SORT = {kupione: (a, b) => (a.d_bought || '').localeCompare(b.d_bought || ''), wystawione: (a, b) => (a.d_listed || '').localeCompare(b.d_listed || ''), kandydat: (a, b) => (b.profit ?? -1e9) - (a.profit ?? -1e9), sprzedane: (a, b) => (b.d_sold || '').localeCompare(a.d_sold || ''), odrzucone: (a, b) => b.t - a.t};
function facts(x) {
  const tgt = x.list_price ?? x.sell;
  if (x.status === 'kandydat') return el('span', null, `Kupno ${zl(x.buy)} · cel sprzedaży ${zl(x.sell)}`, x.profit != null ? [' · ', el('span', {class: 'd-profit ' + (x.profit >= 0 ? 'c-up' : 'c-down')}, `zysk ${zl(x.profit)}${x.roi != null ? ` (${nf(x.roi)}%)` : ''}`)] : null);
  if (x.status === 'kupione') return el('span', null, `Kupione za ${zl(x.bought_price)}${x.costs ? ` + koszty ${zl(x.costs)}` : ''} · ${ago(days(x.d_bought))} · cel sprzedaży ${zl(tgt)}`);
  if (x.status === 'wystawione') return el('span', null, `Wystawione za ${zl(x.list_price)} · ${ago(days(x.d_listed))} · kupione za ${zl(x.bought_price)}${x.costs ? ` + koszty ${zl(x.costs)}` : ''}`);
  if (x.status === 'sprzedane') { const r = realized(x), n = x.d_bought && x.d_sold ? Math.round((new Date(x.d_sold) - new Date(x.d_bought)) / 86400000) : null; return el('span', null, `Sprzedane za ${zl(x.sold_price)} · zysk `, el('span', {class: 'd-profit ' + (r >= 0 ? 'c-up' : 'c-down')}, zl(r)), n != null ? ` · ${n} dni od zakupu` : ''); }
  return el('span', null, 'Odrzucone');
}
const FIELDS = {
  bought: [['price', 'Cena zakupu (zł)', x => x.buy], ['costs', 'Dodatkowe koszty (zł)', x => x.costs || 0], ['date', 'Data zakupu']],
  listed: [['price', 'Cena wystawienia (zł)', x => x.list_price ?? x.sell], ['date', 'Data wystawienia']],
  sold: [['price', 'Cena sprzedaży (zł)', x => x.list_price ?? x.sell], ['fee', 'Prowizja serwisu (zł)', null, x => `auto (${x.fee || 0}%)`], ['date', 'Data sprzedaży']],
};
const TITLE = {bought: 'Zapisz zakup', listed: 'Zapisz wystawienie', sold: 'Zapisz sprzedaż'};
function dealForm(x, action) {
  const kids = FIELDS[action].map(([f, label, def, ph]) => { const isDate = f === 'date', v = isDate ? ymd(new Date()) : def ? def(x) : '';
    return el('label', {class: 'f-lab'}, label, el('input', {'data-k': `d${x.t}-${action}-${f}`, 'data-f': f, type: isDate ? 'date' : 'number', min: isDate ? null : '0', step: isDate ? null : '0.01', inputmode: isDate ? null : 'decimal', value: v == null ? '' : String(v), placeholder: ph ? ph(x) : null})); });

  form.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); form.querySelector('.alf-btn.p').click(); } });
  return form;
}
function moreSheet(x) {
  const body = el('div', {class: 'd-acts', style: 'flex-direction:column;align-items:stretch;gap:10px;margin-top:6px'}), sh = Calm.sheet({title: x.name || 'Oferta', body});
  const b = (label, fn, cls) => body.append(el('button', {class: 'alf-btn' + (cls ? ' ' + cls : ''), type: 'button', disabled: S.offline, onclick: () => { sh.close(); fn(); }}, label));

  const body = el('div'), sh = Calm.sheet({title: 'Zadania z rozmowy', body}), on = j.tasks.map(() => true);
  body.append(el('p', {class: 'c-note', style: 'margin-top:0'}, 'Odznacz zbędne. Zaznaczone trafią do planu dnia w zakładce Alfred.'));
  j.tasks.forEach((t, i) => { const cb = el('input', {type: 'checkbox', checked: true, style: 'width:22px;height:22px'}); cb.addEventListener('change', () => { on[i] = cb.checked; }); body.append(el('label', {class: 'l-row', style: 'cursor:pointer'}, cb, el('span', {class: 'em'}, t.text, el('span', {class: 't-pill', style: 'margin-left:8px'}, `${t.min} min`), el('span', {class: 't-pill', style: 'margin-left:6px'}, t.date)))); });
  body.append(el('div', {class: 'alf-actions', style: 'margin-top:14px'}, el('button', {class: 'alf-btn p', type: 'button', onclick: () => { const add = j.tasks.filter((t, i) => on[i]); add.forEach(t => S.tasks.push({t: newId(), text: t.text, date: t.date, done: false, top: false, done_ts: null, min: t.min, ref: ''})); persist('alfred_tasks'); sh.close(); Calm.toast(`Dodano do planu dnia: ${add.length}.`); }}, 'Dodaj zaznaczone do planu dnia'), el('button', {class: 'alf-btn', type: 'button', onclick: () => sh.close()}, 'Anuluj')));
}

// ----------------------------------------------------------------- start
function renderAll() { renderBanner(); renderKpis(); renderAttn(); renderDeals(); showNext(); if (S.redraw) S.redraw(); }
async function loadToday() {
  const t = await soft('today');
  if (t) { S.today = t; if (S.offline) { S.offline = false; syncAll(); } } else { S.offline = true; retrySoon(); }
  if (!autoBubble && Date.now() - lastTouch > 90000 && !alf.busy) autoBubble = true;
  renderAll();
}
async function loadMeta() { const al = await soft('alfred'); if (al) { S.ai = al.ai; S.prompts = al.prompts || {}; } }
(async () => {
  alf = Alfred.mount($('stage'), {role: 'mentor', name: 'Alfred · doradca', page: 'zarabiaj', onCommand, helpText: HELP, replyActions: () => [{label: 'Zamień na zadania', onclick: convertToTasks}], placeholder: 'Zapytaj o pomysł albo powiedz: kupiłem rower za 300…'});
  alf.setChips(chips()); renderAll(); showNext(true);
  const keys = Object.keys(KEYS), loaded = await Promise.all(keys.map(k => UD.load(k)));
  keys.forEach((k, i) => { const [f, parse] = KEYS[k]; if (loaded[i].offline) S.offline = true; S[f] = parse(loaded[i].value); });
  // pierwsze użycie po aktualizacji: przenosimy stare dane z przeglądarki (listę ofert, wpisy, profil), jeśli serwer jeszcze ich nie ma
  if (!loaded.some(l => l.offline)) {
    if (!loaded[keys.indexOf('produkty_lista')].found) { try { const old = JSON.parse(lg('produkty_lista')); if (Array.isArray(old) && old.length) { S.list = old.slice(-500); persist('produkty_lista'); } } catch (e) { /* brak */ } }
    if (!loaded[keys.indexOf('zarobki')].found) { try { const old = JSON.parse(lg('zarobki_wpisy')); if (Array.isArray(old) && old.length) { S.zar = {entries: old.slice(-2000), goal: parseFloat(lg('zarobki_cel')) || null}; persist('zarobki'); } } catch (e) { /* brak */ } }
    if (!loaded[keys.indexOf('mentor_profile')].found) { try { const old = JSON.parse(lg('mentor_p_all')); if (old && typeof old === 'object') { S.profile = old; persist('mentor_profile'); } } catch (e) { /* brak */ } }
  }
  renderAll(); await Promise.all([loadToday(), loadMeta()]); showNext(true);
  const h = location.hash.slice(1); if (h === 'nowa') openWizard(); else if (h === 'wyniki') openResults();
  setInterval(loadToday, 120000); window.__alfred = alf;
})();
})();
</script>
